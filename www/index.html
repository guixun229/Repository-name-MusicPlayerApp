<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="音轨">
<meta name="application-name" content="音轨">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="音轨 - 极简唱片音乐播放器">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="shortcut icon" href="icons/favicon.ico">
<meta name="version" content="1.2.1">
<script src="cordova.js"></script>
<title>音轨</title>
<style>
/* ==================== Reset & Base ==================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  /* Themeable colors */
  --bg-base: #0a0a0a;
  --bg-mid: #1a1a1a;
  --record-base: #030303;
  --record-mid: #111111;
  --record-light: #1e1e1e;
  --label-color: #c0392b;
  --label-light: #d44336;
  --label-dark: #7d1f12;

  /* Fixed colors */
  --accent: #d4af37;
  --accent-dim: rgba(212, 175, 55, 0.4);
  --text: #f0f0f0;
  --text-dim: rgba(240, 240, 240, 0.35);
  --edit-blue: #3a7bd5;
  --delete-red: #e74c3c;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  background: var(--bg-base);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
  position: fixed;
  width: 100%;
  touch-action: manipulation;
}

/* ==================== Player View ==================== */
#player-view {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  background: radial-gradient(ellipse at 50% 45%, var(--bg-mid) 0%, var(--bg-base) 50%, #050505 100%);
  transition: background 0.4s ease;
}

/* Top Bar */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: max(20px, env(safe-area-inset-top)) 24px 12px;
  z-index: 20;
  flex-shrink: 0;
}

.top-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.settings-icon {
  width: 22px;
  height: 22px;
  color: var(--accent);
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}

.settings-icon:active {
  opacity: 0.5;
  transform: scale(0.9);
}

.app-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 6px;
  text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
}

/* Triangle Button */
.list-btn {
  width: 0;
  height: 0;
  border-top: 9px solid transparent;
  border-bottom: 9px solid transparent;
  border-left: 15px solid var(--accent);
  cursor: pointer;
  transition: all 0.2s;
  filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4));
  padding: 0;
  margin-right: 4px;
}

.list-btn:active {
  opacity: 0.5;
  transform: scale(0.9);
}

/* ==================== Vinyl Record ==================== */
.record-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  min-height: 0;
  padding: 10px;
}

.record-container::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 360px;
  height: 360px;
  max-width: 95vw;
  max-height: 95vw;
  border-radius: 50%;
  background: radial-gradient(circle, #151515 0%, #0c0c0c 60%, transparent 75%);
  box-shadow: 0 0 100px rgba(0, 0, 0, 0.6);
}

.record-wrap {
  position: relative;
  width: 320px;
  height: 320px;
  max-width: 82vw;
  max-height: 82vw;
  touch-action: none;
}

@media (max-width: 400px) {
  .record-wrap { width: 270px; height: 270px; }
}

@media (max-width: 320px) {
  .record-wrap { width: 230px; height: 230px; }
}

.record {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  position: relative;
  cursor: grab;
  will-change: transform;
  background:
    repeating-radial-gradient(circle at center, transparent 0, transparent 1px, rgba(255,255,255,0.028) 1px, rgba(255,255,255,0.028) 2px),
    repeating-radial-gradient(circle at center, transparent 0, transparent 3px, rgba(0,0,0,0.35) 3px, rgba(0,0,0,0.35) 4px),
    repeating-radial-gradient(circle at center, transparent 0, transparent 28px, rgba(0,0,0,0.55) 28px, rgba(0,0,0,0.55) 30px),
    radial-gradient(circle at 42% 38%, var(--record-light) 0%, var(--record-mid) 45%, var(--record-base) 85%, var(--record-base) 100%);
  box-shadow:
    0 25px 70px rgba(0, 0, 0, 0.85),
    0 0 0 1px rgba(255, 255, 255, 0.04),
    inset 0 0 50px rgba(0, 0, 0, 0.7),
    inset 0 2px 0 rgba(255, 255, 255, 0.03);
  transition: background 0.4s ease;
}

.record::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--record-light), var(--record-base) 40%, var(--record-base) 60%, var(--record-light) 100%);
  z-index: -1;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5);
  transition: background 0.4s ease;
}

.record-label {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 36%;
  height: 36%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--label-light) 0%, var(--label-color) 30%, var(--label-dark) 70%, var(--label-dark) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transform: translate(-50%, -50%);
  box-shadow:
    inset 0 2px 5px rgba(255, 255, 255, 0.1),
    inset 0 -2px 5px rgba(0, 0, 0, 0.3),
    0 0 0 2px rgba(0, 0, 0, 0.4),
    0 0 0 3px rgba(255, 255, 255, 0.05);
  z-index: 4;
  transition: background 0.4s ease;
}

.record-label::before {
  content: '';
  position: absolute;
  inset: 6px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.record-label::after {
  content: '';
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.label-text {
  font-size: 13px;
  color: #f5e6d3;
  text-align: center;
  padding: 0 8px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: 1px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  font-weight: 500;
  position: relative;
  z-index: 1;
}

.label-sub {
  font-size: 8px;
  color: rgba(255, 230, 210, 0.5);
  letter-spacing: 2px;
  margin-top: 3px;
  position: relative;
  z-index: 1;
}

.record-hole {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #000;
  box-shadow: inset 0 0 3px rgba(255, 255, 255, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.8);
  z-index: 6;
}

.record-image-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background-size: cover;
  background-position: center;
  display: none;
  z-index: 3;
  pointer-events: none;
}

.label-image-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background-size: cover;
  background-position: center;
  display: none;
  z-index: 1;
  pointer-events: none;
}

.record-gloss {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  pointer-events: none;
  background: conic-gradient(from 200deg, transparent 0deg, rgba(255,255,255,0.14) 15deg, rgba(255,255,255,0.04) 45deg, transparent 90deg, transparent 250deg, rgba(255,255,255,0.06) 290deg, rgba(255,255,255,0.12) 320deg, transparent 355deg);
  z-index: 5;
}

.record-gloss::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.01) 25%, transparent 50%, rgba(255,255,255,0.02) 75%, rgba(255,255,255,0.07) 100%);
}

/* ==================== Progress Bar ==================== */
.progress-bar {
  position: absolute;
  bottom: max(50px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  width: 70%;
  max-width: 320px;
  height: 24px;
  z-index: 10;
  display: flex;
  align-items: center;
  cursor: pointer;
  touch-action: none;
}

.progress-track {
  width: 100%;
  height: 3px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px;
  position: relative;
  overflow: visible;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  border-radius: 2px;
  transition: width 0.15s linear;
  box-shadow: 0 0 6px var(--accent-dim);
  position: relative;
}

.progress-fill::after {
  content: '';
  position: absolute;
  right: -7px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px rgba(212, 175, 55, 0.6), 0 2px 4px rgba(0,0,0,0.3);
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
}

.progress-bar.dragging .progress-fill::after,
.progress-bar:active .progress-fill::after {
  opacity: 1;
  transform: translateY(-50%) scale(1.3);
}

.progress-bar.dragging .progress-fill {
  transition: none;
}

/* Seek time display */
.seek-display {
  position: absolute;
  bottom: max(80px, calc(env(safe-area-inset-bottom) + 30px));
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  letter-spacing: 1px;
  z-index: 10;
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
  white-space: nowrap;
}

.seek-display.show {
  opacity: 1;
}

/* ==================== Mode Indicator ==================== */
.mode-indicator {
  position: absolute;
  bottom: max(20px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: var(--text-dim);
  z-index: 10;
  letter-spacing: 3px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.mode-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-dim);
  transition: all 0.3s;
}

.mode-dot.active {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

/* ==================== Toast ==================== */
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: var(--text);
  padding: 10px 28px;
  border-radius: 22px;
  font-size: 14px;
  opacity: 0;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
  z-index: 200;
  border: 1px solid rgba(255, 255, 255, 0.06);
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ==================== Shared Panel (List + Settings) ==================== */
.slide-panel {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at 50% 0%, var(--bg-mid) 0%, var(--bg-base) 40%, #050505 100%);
  z-index: 50;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  will-change: transform;
}

.slide-panel.show {
  transform: translateX(0);
}

.panel-header {
  display: flex;
  align-items: center;
  padding: max(20px, env(safe-area-inset-top)) 24px 16px;
  gap: 16px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
}

.back-btn {
  width: 0;
  height: 0;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-right: 13px solid var(--accent);
  cursor: pointer;
  transition: all 0.2s;
  filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.3));
  flex-shrink: 0;
}

.back-btn:active {
  transform: scale(0.85);
}

.panel-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 3px;
}

/* ==================== Category Bar ==================== */
.category-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px 8px;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  flex-shrink: 0;
  touch-action: pan-x;
}

.category-bar::-webkit-scrollbar { display: none; }

.category-pill {
  flex-shrink: 0;
  padding: 7px 18px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-dim);
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  touch-action: manipulation;
}

.category-pill.active {
  background: rgba(212, 175, 55, 0.12);
  border-color: var(--accent-dim);
  color: var(--accent);
}

.category-pill:active { transform: scale(0.95); }

.category-add {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px dashed var(--accent-dim);
  background: transparent;
  color: var(--accent);
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  line-height: 1;
}

.category-add:active { transform: scale(0.9); background: rgba(212, 175, 55, 0.1); }

/* ==================== Action Buttons ==================== */
.list-actions {
  display: flex;
  gap: 12px;
  padding: 8px 24px 12px;
  flex-shrink: 0;
}

.action-btn {
  flex: 1;
  padding: 13px 8px;
  border: 1px solid var(--accent-dim);
  border-radius: 12px;
  background: rgba(212, 175, 55, 0.04);
  color: var(--accent);
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  letter-spacing: 1px;
}

.action-btn:active { background: rgba(212, 175, 55, 0.15); transform: scale(0.97); }
.action-icon { font-size: 16px; line-height: 1; }

/* ==================== Track List ==================== */
.track-list-wrapper {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 0;
  min-height: 0;
  position: relative;
}

.track-list { padding: 4px 0 60px; }

.track-item {
  position: relative;
  overflow: hidden;
  touch-action: none;
  -webkit-touch-callout: none;
}

.track-actions {
  position: absolute;
  top: 0;
  right: 0;
  height: 100%;
  display: flex;
  z-index: 1;
  touch-action: manipulation;
}

.track-action {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 72px;
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  letter-spacing: 1px;
  transition: filter 0.2s;
  touch-action: manipulation;
}

.track-action:active { filter: brightness(0.85); }
.track-action.edit { background: var(--edit-blue); }
.track-action.delete { background: var(--delete-red); }

.track-item-content {
  position: relative;
  z-index: 2;
  background: var(--bg-base);
  display: flex;
  align-items: center;
  padding: 13px 24px;
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  will-change: transform;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  cursor: pointer;
  touch-action: none;
  -webkit-touch-callout: none;
}

.track-item.dragging-mode .track-actions {
  display: none;
}

.track-item-content.dragging {
  transition: none;
  z-index: 100;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(212, 175, 55, 0.3);
  background: #1a1a1a;
  opacity: 0.95;
  border-radius: 8px;
  touch-action: none;
}

.track-item.dragging-mode .track-item-content {
  border-bottom: none;
}

.track-item-content.revealed { transform: translateX(-144px); }
.track-item-content.near-revealed { transform: translateX(-72px); }

.track-item.active .track-item-content { color: var(--accent); }
.track-item.active .track-number { color: var(--accent); }

.track-number {
  width: 32px;
  text-align: center;
  color: var(--text-dim);
  font-size: 14px;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.track-info-cell { flex: 1; min-width: 0; }

.track-name {
  font-size: 15px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 2px;
}

.track-type { font-size: 11px; color: var(--text-dim); }
.track-type.video { color: rgba(212, 175, 55, 0.5); }

.track-drag-handle {
  color: rgba(255, 255, 255, 0.15);
  font-size: 16px;
  padding: 0 4px;
  flex-shrink: 0;
  touch-action: none;
  cursor: grab;
}

.empty-list {
  text-align: center;
  color: var(--text-dim);
  padding: 50px 0;
  font-size: 14px;
}

.empty-list .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.15; }

/* ==================== Settings View ==================== */
.settings-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px 24px 60px;
}

.settings-section {
  margin-bottom: 32px;
}

.settings-section-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 2px;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(212, 175, 55, 0.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: opacity 0.2s;
}

.settings-section-title:active { opacity: 0.6; }

.settings-section-title .arrow {
  font-size: 14px;
  transition: transform 0.3s ease;
}

.settings-section.collapsed .arrow { transform: rotate(-90deg); }

.settings-section-body {
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.3s ease;
  max-height: 2000px;
  opacity: 1;
}

.settings-section.collapsed .settings-section-body {
  max-height: 0;
  opacity: 0;
}

.settings-row {
  margin-bottom: 24px;
}

.settings-label {
  font-size: 14px;
  color: var(--text);
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.color-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}

.color-swatch {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid rgba(255, 255, 255, 0.1);
  transition: all 0.2s;
  position: relative;
  flex-shrink: 0;
}

.color-swatch:active { transform: scale(0.9); }

.color-swatch.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
  transform: scale(1.1);
}

.color-swatch.selected::after {
  content: '✓';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

.color-custom-wrap {
  position: relative;
  width: 40px;
  height: 40px;
  flex-shrink: 0;
}

.color-custom {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px dashed var(--accent-dim);
  cursor: pointer;
  background: transparent;
  -webkit-appearance: none;
  appearance: none;
  padding: 0;
  overflow: hidden;
}

.color-custom::-webkit-color-swatch-wrapper { padding: 0; }
.color-custom::-webkit-color-swatch { border: none; border-radius: 50%; }
.color-custom::-moz-color-swatch { border: none; border-radius: 50%; }

.color-custom-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 18px;
  color: var(--accent);
  pointer-events: none;
}

/* Custom background image */
.bg-image-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.bg-image-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}

.bg-image-preview {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  border: 2px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.03);
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.2s;
}

.bg-image-preview:active { transform: scale(0.92); }

.bg-image-preview.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
}

.bg-image-preview.selected .placeholder { display: none; }

.bg-image-preview .placeholder {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 24px;
  color: var(--text-dim);
}

.bg-image-preview .remove-mini {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(231, 76, 60, 0.85);
  color: #fff;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
  line-height: 1;
}

.bg-image-preview .remove-mini:active { transform: scale(0.85); }

.bg-image-actions {
  display: flex;
  gap: 10px;
  flex: 1;
}

.bg-image-btn {
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid var(--accent-dim);
  background: rgba(212, 175, 55, 0.04);
  color: var(--accent);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
  text-align: center;
}

.bg-image-btn:active { background: rgba(212, 175, 55, 0.15); transform: scale(0.97); }
.bg-image-btn.danger { border-color: rgba(231, 76, 60, 0.4); color: var(--delete-red); background: rgba(231, 76, 60, 0.03); }

/* Opacity slider */
.opacity-slider-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
}

.opacity-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.1);
  outline: none;
}

.opacity-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
}

.opacity-slider::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: none;
  box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
}

.opacity-value {
  font-size: 13px;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  min-width: 36px;
  text-align: right;
}

/* Data section buttons */
.data-btns {
  display: flex;
  gap: 12px;
}

.data-btn {
  flex: 1;
  padding: 14px 8px;
  border: 1px solid var(--accent-dim);
  border-radius: 12px;
  background: rgba(212, 175, 55, 0.04);
  color: var(--accent);
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
}

.data-btn:active { background: rgba(212, 175, 55, 0.15); transform: scale(0.97); }

/* ==================== Batch Mode ==================== */
.list-actions.batch-mode { display: none; }

.batch-toolbar {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 8px 24px 12px;
  flex-shrink: 0;
}
.batch-toolbar.show { display: flex; }
.list-actions.batch-mode + .batch-toolbar { display: flex; }

.batch-select-all {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border: 1px solid var(--accent-dim);
  border-radius: 10px;
  font-size: 13px;
  color: var(--accent);
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
  touch-action: manipulation;
}
.batch-select-all:active { transform: scale(0.97); }

.batch-select-all .check-box {
  width: 18px;
  height: 18px;
  border: 2px solid var(--accent-dim);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.batch-select-all.checked .check-box {
  background: var(--accent);
  border-color: var(--accent);
}
.batch-select-all.checked .check-box::after {
  content: '✓';
  color: #0a0a0a;
  font-size: 12px;
  font-weight: bold;
}

.batch-count {
  flex: 1;
  text-align: center;
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  font-weight: 500;
}

.batch-categorize-btn {
  padding: 10px 16px;
  border: none;
  border-radius: 10px;
  background: var(--edit-blue);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
  touch-action: manipulation;
  letter-spacing: 1px;
}
.batch-categorize-btn:active { transform: scale(0.97); filter: brightness(0.85); }
.batch-categorize-btn:disabled { opacity: 0.4; }

.batch-delete-btn {
  padding: 10px 16px;
  border: none;
  border-radius: 10px;
  background: var(--delete-red);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
  touch-action: manipulation;
  letter-spacing: 1px;
}
.batch-delete-btn:active { transform: scale(0.97); filter: brightness(0.85); }
.batch-delete-btn:disabled { opacity: 0.4; }

.track-item .batch-check {
  display: none;
  width: 22px;
  height: 22px;
  min-width: 22px;
  border: 2px solid rgba(255,255,255,0.25);
  border-radius: 5px;
  margin-right: 12px;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.track-item.batch-mode .batch-check { display: flex; }
.track-item.batch-mode .track-drag-handle { display: none; }
.track-item.batch-mode .track-actions { display: none; }
.track-item.batch-mode .track-item-content { touch-action: manipulation; }

.track-item.batch-selected .batch-check {
  background: var(--accent);
  border-color: var(--accent);
}
.track-item.batch-selected .batch-check::after {
  content: '✓';
  color: #0a0a0a;
  font-size: 13px;
  font-weight: bold;
}

/* ==================== Modal ==================== */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}

.modal-overlay.show { opacity: 1; pointer-events: auto; }

.modal {
  width: 86%;
  max-width: 360px;
  background: linear-gradient(135deg, #1a1a1a, #121212);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  overflow: hidden;
  transform: scale(0.9);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal-overlay.show .modal { transform: scale(1); }

.modal-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  text-align: center;
  padding: 22px 24px 8px;
  letter-spacing: 1px;
}

.modal-body {
  padding: 8px 24px 20px;
  text-align: center;
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1.5;
}

.modal-input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  color: var(--text);
  font-size: 15px;
  outline: none;
  margin-top: 8px;
  transition: border-color 0.2s;
}

.modal-input:focus { border-color: var(--accent-dim); }

.modal-actions {
  display: flex;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
}

.modal-btn {
  flex: 1;
  padding: 15px;
  background: transparent;
  border: none;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
  color: var(--text-dim);
}

.modal-btn:active { background: rgba(255, 255, 255, 0.05); }
.modal-btn.cancel { border-right: 1px solid rgba(255, 255, 255, 0.06); }
.modal-btn.confirm { color: var(--accent); font-weight: 600; }
.modal-btn.danger { color: var(--delete-red); }

/* ==================== Loading spinner ==================== */
.loading-ring {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 40px;
  height: 40px;
  border: 2px solid transparent;
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: loadingSpin 0.8s linear infinite;
  z-index: 10;
  opacity: 0;
  transition: opacity 0.3s;
}

.loading-ring.show { opacity: 1; }

@keyframes loadingSpin {
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

audio, video { display: none !important; }
input[type="file"] { display: none; }
</style>
</head>

<div id="settings-view" class="slide-panel">

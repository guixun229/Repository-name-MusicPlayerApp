name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK
        uses: nizarmah/action-webview-android@v1
        with:
          app_name: 线条音乐盒
          package_name: com.music.player
          source: ./
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-App
          path: app-debug.apk
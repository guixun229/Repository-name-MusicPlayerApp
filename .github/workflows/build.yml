name: Android CI

on:
  push:
    branches: [ "main", "master" ] # 监听 main 或 master 分支的推送
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 服务器环境

    steps:
      # 1. 获取你的代码
      - name: 检出代码 (Checkout Code)
        uses: actions/checkout@v4

      # 2. 安装 Java (Android 需要)
      - name: 设置 JDK (Setup Java)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # 使用 Java 17

      # 3. 安装 Node.js (关键步骤：让服务器安装 Node)
      - name: 设置 Node.js (Setup Node)
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 使用 Node 20

      # 4. 安装 npm 依赖
      - name: 安装依赖 (Install Dependencies)
        run: npm ci

      # 5. 生成 Android 项目 (关键步骤：自动创建 android 文件夹)
      - name: 添加 Android 平台 (Add Android Platform)
        run: |
          # 如果 android 文件夹不存在，则创建
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          # 同步代码到 Android
          npx cap sync android

      # 6. 给 gradlew 权限 (Linux 系统需要)
      - name: 授予权限 (Grant Execute Permission)
        run: chmod +x ./android/gradlew

      # 7. 编译 APK
      - name: 构建 APK (Build APK)
        run: |
          cd android
          ./gradlew assembleDebug

      # 8. 上传 APK (方便下载)
      - name: 上传 APK (Upload Artifact)
        uses: actions/upload-artifact@v3
        with:
          name: my-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

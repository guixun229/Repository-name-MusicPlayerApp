name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 安装 Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
      
      - name: 初始化 Capacitor
        run: npx cap init 线条音乐盒 com.music.player --web-dir=www
      
      - name: 添加 Android 平台
        run: npx cap add android
      
      - name: 同步文件
        run: npx cap sync
      
      - name: 构建 APK
        uses: nizarmah/action-webview-android@v1
        with:
          app_name: 线条音乐盒
          package_name: com.music.player
          source: ./
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-App
          path: app-debug.apk
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
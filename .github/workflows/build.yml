name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装依赖
        run: npm install

      - name: 确保 www 目录存在
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><body>Hello</body></html>' > www/index.html

      - name: 安装 Capacitor 与安卓
        run: npm install @capacitor/core @capacitor/android

      - name: 同步资源
        run: npx cap sync android

      - name: 清理并构建 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-App
          path: android/app/build/outputs/apk/debug/*.apk

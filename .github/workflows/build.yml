name: Build WebView APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK
        uses: bajicdusko/webview-apk@v1
        with:
          app_name: 线条音乐盒
          package_name: com.music.player
          source_code_path: ./
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./app-debug.apk
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      # 强制保证 www/index.html 一定存在
      - name: 创建网页入口
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>音乐播放器</body></html>' > www/index.html
      
      - name: 安装依赖
        run: npm install
      
      # 只同步，不重新初始化、不重新添加平台
      - name: 同步 Capacitor
        run: npx cap sync
      
      - name: 构建 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug
      
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-App
          path: android/app/build/outputs/apk/debug/*.apk

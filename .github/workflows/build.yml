name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 创建 Android 项目结构
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/values
          cp index.html app/src/main/assets/
      
      - name: 创建 AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android"
          package="com.music.player">
      
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
          <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
          <uses-permission android:name="android.permission.WAKE_LOCK" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
          <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
          <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
      
          <application
              android:allowBackup="true"
              android:icon="@mipmap/ic_launcher"
              android:label="线条音乐盒"
              android:roundIcon="@mipmap/ic_launcher_round"
              android:supportsRtl="true"
              android:theme="@style/Theme.AppCompat.Light.NoActionBar"
              android:usesCleartextTraffic="true">
              
              <activity
                  android:name=".MainActivity"
                  android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                  android:exported="true"
                  android:launchMode="singleTask">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>
              
          </application>
      </manifest>
      EOF
      
      - name: 创建 MainActivity.java
        run: |
          mkdir -p app/src/main/java/com/music/player
          cat > app/src/main/java/com/music/player/MainActivity.java << 'EOF'
      package com.music.player;
      
      import android.os.Bundle;
      import android.webkit.WebView;
      import android.webkit.WebViewClient;
      import android.webkit.WebChromeClient;
      import android.webkit.WebSettings;
      import androidx.appcompat.app.AppCompatActivity;
      import android.Manifest;
      import android.content.pm.PackageManager;
      import android.os.Build;
      import androidx.core.app.ActivityCompat;
      import androidx.core.content.ContextCompat;
      
      public class MainActivity extends AppCompatActivity {
          private WebView webView;
          
          @Override
          protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              
              requestPermissions();
              
              webView = new WebView(this);
              setContentView(webView);
              
              WebSettings webSettings = webView.getSettings();
              webSettings.setJavaScriptEnabled(true);
              webSettings.setDomStorageEnabled(true);
              webSettings.setAllowFileAccess(true);
              webSettings.setAllowFileAccessFromFileURLs(true);
              webSettings.setAllowUniversalAccessFromFileURLs(true);
              webSettings.setMediaPlaybackRequiresUserGesture(false);
              
              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient());
              
              webView.loadUrl("file:///android_asset/index.html");
          }
          
          private void requestPermissions() {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                  String[] permissions = {
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.READ_MEDIA_AUDIO,
                      Manifest.permission.READ_MEDIA_VIDEO,
                      Manifest.permission.POST_NOTIFICATIONS
                  };
                  ActivityCompat.requestPermissions(this, permissions, 1);
              } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                  String[] permissions = {
                      Manifest.permission.READ_EXTERNAL_STORAGE,
                      Manifest.permission.RECORD_AUDIO
                  };
                  ActivityCompat.requestPermissions(this, permissions, 1);
              }
          }
          
          @Override
          public void onBackPressed() {
              if (webView.canGoBack()) {
                  webView.goBack();
              } else {
                  super.onBackPressed();
              }
          }
      }
      EOF
      
      - name: 创建 build.gradle
        run: |
          cat > build.gradle << 'EOF'
      buildscript {
          repositories {
              google()
              mavenCentral()
          }
          dependencies {
              classpath 'com.android.tools.build:gradle:8.1.4'
          }
      }
      
      allprojects {
          repositories {
              google()
              mavenCentral()
          }
      }
      EOF
      
          cat > app/build.gradle << 'EOF'
      plugins {
          id 'com.android.application'
      }
      
      android {
          namespace 'com.music.player'
          compileSdk 34
          
          defaultConfig {
              applicationId "com.music.player"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
          }
          
          buildTypes {
              release {
                  minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
              }
          }
      }
      
      dependencies {
          implementation 'androidx.appcompat:appcompat:1.6.1'
          implementation 'androidx.webkit:webkit:1.9.0'
      }
      EOF
      
      - name: 创建 settings.gradle
        run: echo "include ':app'" > settings.gradle
      
      - name: 创建 gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
      distributionBase=GRADLE_USER_HOME
      distributionPath=wrapper/dists
      distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
      zipStoreBase=GRADLE_USER_HOME
      zipStorePath=wrapper/dists
      EOF
      
      - name: 创建图标
        run: |
          echo "ic_launcher" > app/src/main/res/mipmap-hdpi/ic_launcher.png
          echo "ic_launcher" > app/src/main/res/mipmap-mdpi/ic_launcher.png
          echo "ic_launcher" > app/src/main/res/mipmap-xhdpi/ic_launcher.png
          echo "ic_launcher" > app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          echo "ic_launcher" > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      
      - name: 创建主题
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml << 'EOF'
      <?xml version="1.0" encoding="utf-8"?>
      <resources>
          <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light">
              <item name="windowActionBar">false</item>
              <item name="windowNoTitle">true</item>
          </style>
      </resources>
      EOF
      
      - name: 设置执行权限
        run: |
          chmod +x gradlew 2>/dev/null || true
          chmod +x app/src/main/assets/index.html 2>/dev/null || true
      
      - name: 构建 APK
        run: |
          ./gradlew assembleDebug --no-daemon
      
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-App
          path: app/build/outputs/apk/debug/*.apk
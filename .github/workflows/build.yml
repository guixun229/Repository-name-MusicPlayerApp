name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 创建 Android 项目结构
        run: |
          # 创建目录
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/music/player
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          
          # 复制网页文件
          cp -r www/* app/src/main/assets/
          
          # 创建 AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android"
          package="com.music.player">
      
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
      
          <application
              android:allowBackup="true"
              android:icon="@drawable/ic_launcher"
              android:label="线条音乐盒"
              android:usesCleartextTraffic="true"
              android:theme="@style/AppTheme">
              
              <activity
                  android:name=".MainActivity"
                  android:configChanges="orientation|keyboardHidden|screenSize"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>
              
          </application>
      </manifest>
      EOF
      
      - name: 创建 MainActivity.java
        run: |
          cat > app/src/main/java/com/music/player/MainActivity.java << 'EOF'
      package com.music.player;
      
      import android.os.Bundle;
      import android.webkit.WebView;
      import android.webkit.WebViewClient;
      import android.webkit.WebChromeClient;
      import android.webkit.WebSettings;
      import androidx.appcompat.app.AppCompatActivity;
      
      public class MainActivity extends AppCompatActivity {
          private WebView webView;
          
          @Override
          protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              
              webView = new WebView(this);
              setContentView(webView);
              
              WebSettings webSettings = webView.getSettings();
              webSettings.setJavaScriptEnabled(true);
              webSettings.setDomStorageEnabled(true);
              webSettings.setAllowFileAccess(true);
              webSettings.setMediaPlaybackRequiresUserGesture(false);
              
              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient());
              
              webView.loadUrl("file:///android_asset/index.html");
          }
          
          @Override
          public void onBackPressed() {
              if (webView.canGoBack()) {
                  webView.goBack();
              } else {
                  super.onBackPressed();
              }
          }
      }
      EOF
      
      - name: 创建主题样式
        run: |
          cat > app/src/main/res/values/styles.xml << 'EOF'
      <?xml version="1.0" encoding="utf-8"?>
      <resources>
          <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
              <item name="colorPrimary">#2c4b6e</item>
              <item name="colorPrimaryDark">#1a3b55</item>
          </style>
      </resources>
      EOF
      
      - name: 创建简单图标
        run: |
          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
      <shape xmlns:android="http://schemas.android.com/apk/res/android"
          android:shape="rectangle">
          <solid android:color="#2c4b6e"/>
          <corners android:radius="20dp"/>
      </shape>
      EOF
      
      - name: 创建 build.gradle（项目级）
        run: |
          cat > build.gradle << 'EOF'
      buildscript {
          repositories {
              google()
              mavenCentral()
          }
          dependencies {
              classpath 'com.android.tools.build:gradle:7.4.2'
          }
      }
      
      allprojects {
          repositories {
              google()
              mavenCentral()
          }
      }
      task clean(type: Delete) {
          delete rootProject.buildDir
      }
      EOF
      
      - name: 创建 build.gradle（应用级）
        run: |
          cat > app/build.gradle << 'EOF'
      plugins {
          id 'com.android.application'
      }
      
      android {
          compileSdk 34
          
          defaultConfig {
              applicationId "com.music.player"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
          }
          
          buildTypes {
              release {
                  minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
              }
          }
      }
      
      dependencies {
          implementation 'androidx.appcompat:appcompat:1.6.1'
          implementation 'androidx.webkit:webkit:1.9.0'
      }
      EOF
      
      - name: 创建 settings.gradle
        run: echo "include ':app'" > settings.gradle
      
      - name: 下载 gradle-wrapper
        run: |
          mkdir -p gradle/wrapper
          cd gradle/wrapper
          wget https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar
          echo "distributionBase=GRADLE_USER_HOME" > gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip" >> gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle-wrapper.properties
          cd ../..
      
      - name: 创建 gradlew 脚本
        run: |
          cat > gradlew << 'EOF'
      #!/bin/sh
      JAVA_HOME=$JAVA_HOME_17_X64
      exec java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain "$@"
      EOF
          chmod +x gradlew
      
      - name: 构建 APK
        run: |
          ./gradlew assembleDebug --no-daemon
      
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-App
          path: app/build/outputs/apk/debug/*.apk
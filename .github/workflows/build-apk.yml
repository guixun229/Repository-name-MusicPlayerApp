name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Copy native files to Android
        run: |
          # 创建 Java 包目录（包名必须和 capacitor.config.json 里的 appId 一致）
          mkdir -p android/app/src/main/java/com/yingu/player

          # 从根目录复制 Java 文件
          cp MainActivity.java android/app/src/main/java/com/yingu/player/ 2>/dev/null || true
          cp MusicService.java android/app/src/main/java/com/yingu/player/ 2>/dev/null || true
          cp YinguMusicPlugin.java android/app/src/main/java/com/yingu/player/ 2>/dev/null || true

          # 复制配置文件到 Android 目录（只复制 config.xml，不复制 plugin.xml）
          mkdir -p android/app/src/main/res/xml
          cp config.xml android/app/src/main/res/xml/ 2>/dev/null || true

          # 复制 JS 插件文件
          mkdir -p android/app/src/main/assets/public
          cp YinguMusic.js android/app/src/main/assets/public/ 2>/dev/null || true

      - name: Generate Android assets
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-packages: "platforms;android-33 build-tools;33.0.0"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
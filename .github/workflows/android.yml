name: 构建Android应用

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 必须先拉取最新代码 (关键步骤)
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装项目依赖 (关键，否则 npx cap 找不到)
      - name: 安装依赖
        run: npm install

      # 4. 强制验证并创建入口文件 (保底措施，防止遗漏)
      - name: 验证Web资源
        run: |
          pwd
          ls -la
          # 检查www目录和index.html是否真的存在
          if [ ! -d "www" ]; then mkdir www; fi
          if [ ! -f "www/index.html" ]; then echo '<!DOCTYPE html><html><body>Music Player</body></html>' > www/index.html; fi

      # 5. 同步Capacitor配置
      - name: 同步Capacitor
        run: npx cap sync

      # 6. 开始构建
      - name: 构建Android
        run: npx cap build android

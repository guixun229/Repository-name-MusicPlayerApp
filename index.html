<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="音轨">
<meta name="application-name" content="音轨">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="音轨 - 极简唱片音乐播放器">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="shortcut icon" href="icons/favicon.ico">
<meta name="version" content="1.2.1">
<script src="cordova.js"></script>
<title>音轨</title>
<style>
/* ==================== Reset & Base ==================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  /* Themeable colors */
  --bg-base: #0a0a0a;
  --bg-mid: #1a1a1a;
  --record-base: #030303;
  --record-mid: #111111;
  --record-light: #1e1e1e;
  --label-color: #c0392b;
  --label-light: #d44336;
  --label-dark: #7d1f12;

  /* Fixed colors */
  --accent: #d4af37;
  --accent-dim: rgba(212, 175, 55, 0.4);
  --text: #f0f0f0;
  --text-dim: rgba(240, 240, 240, 0.35);
  --edit-blue: #3a7bd5;
  --delete-red: #e74c3c;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  background: var(--bg-base);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
  position: fixed;
  width: 100%;
  touch-action: manipulation;
}

/* ==================== Player View ==================== */
#player-view {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  background: radial-gradient(ellipse at 50% 45%, var(--bg-mid) 0%, var(--bg-base) 50%, #050505 100%);
  transition: background 0.4s ease;
}

/* Top Bar */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: max(20px, env(safe-area-inset-top)) 24px 12px;
  z-index: 20;
  flex-shrink: 0;
}

.top-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.settings-icon {
  width: 22px;
  height: 22px;
  color: var(--accent);
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}

.settings-icon:active {
  opacity: 0.5;
  transform: scale(0.9);
}

.app-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 6px;
  text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
}

/* Triangle Button */
.list-btn {
  width: 0;
  height: 0;
  border-top: 9px solid transparent;
  border-bottom: 9px solid transparent;
  border-left: 15px solid var(--accent);
  cursor: pointer;
  transition: all 0.2s;
  filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4));
  padding: 0;
  margin-right: 4px;
}

.list-btn:active {
  opacity: 0.5;
  transform: scale(0.9);
}

/* ==================== Vinyl Record ==================== */
.record-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  min-height: 0;
  padding: 10px;
}

.record-container::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 360px;
  height: 360px;
  max-width: 95vw;
  max-height: 95vw;
  border-radius: 50%;
  background: radial-gradient(circle, #151515 0%, #0c0c0c 60%, transparent 75%);
  box-shadow: 0 0 100px rgba(0, 0, 0, 0.6);
}

.record-wrap {
  position: relative;
  width: 320px;
  height: 320px;
  max-width: 82vw;
  max-height: 82vw;
  touch-action: none;
}

@media (max-width: 400px) {
  .record-wrap { width: 270px; height: 270px; }
}

@media (max-width: 320px) {
  .record-wrap { width: 230px; height: 230px; }
}

.record {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  position: relative;
  cursor: grab;
  will-change: transform;
  background:
    repeating-radial-gradient(circle at center, transparent 0, transparent 1px, rgba(255,255,255,0.028) 1px, rgba(255,255,255,0.028) 2px),
    repeating-radial-gradient(circle at center, transparent 0, transparent 3px, rgba(0,0,0,0.35) 3px, rgba(0,0,0,0.35) 4px),
    repeating-radial-gradient(circle at center, transparent 0, transparent 28px, rgba(0,0,0,0.55) 28px, rgba(0,0,0,0.55) 30px),
    radial-gradient(circle at 42% 38%, var(--record-light) 0%, var(--record-mid) 45%, var(--record-base) 85%, var(--record-base) 100%);
  box-shadow:
    0 25px 70px rgba(0, 0, 0, 0.85),
    0 0 0 1px rgba(255, 255, 255, 0.04),
    inset 0 0 50px rgba(0, 0, 0, 0.7),
    inset 0 2px 0 rgba(255, 255, 255, 0.03);
  transition: background 0.4s ease;
}

.record::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--record-light), var(--record-base) 40%, var(--record-base) 60%, var(--record-light) 100%);
  z-index: -1;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5);
  transition: background 0.4s ease;
}

.record-label {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 36%;
  height: 36%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--label-light) 0%, var(--label-color) 30%, var(--label-dark) 70%, var(--label-dark) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transform: translate(-50%, -50%);
  box-shadow:
    inset 0 2px 5px rgba(255, 255, 255, 0.1),
    inset 0 -2px 5px rgba(0, 0, 0, 0.3),
    0 0 0 2px rgba(0, 0, 0, 0.4),
    0 0 0 3px rgba(255, 255, 255, 0.05);
  z-index: 4;
  transition: background 0.4s ease;
}

.record-label::before {
  content: '';
  position: absolute;
  inset: 6px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.record-label::after {
  content: '';
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.label-text {
  font-size: 13px;
  color: #f5e6d3;
  text-align: center;
  padding: 0 8px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: 1px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  font-weight: 500;
  position: relative;
  z-index: 1;
}

.label-sub {
  font-size: 8px;
  color: rgba(255, 230, 210, 0.5);
  letter-spacing: 2px;
  margin-top: 3px;
  position: relative;
  z-index: 1;
}

.record-hole {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #000;
  box-shadow: inset 0 0 3px rgba(255, 255, 255, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.8);
  z-index: 6;
}

.record-image-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background-size: cover;
  background-position: center;
  display: none;
  z-index: 3;
  pointer-events: none;
}

.label-image-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background-size: cover;
  background-position: center;
  display: none;
  z-index: 1;
  pointer-events: none;
}

.record-gloss {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  pointer-events: none;
  background: conic-gradient(from 200deg, transparent 0deg, rgba(255,255,255,0.14) 15deg, rgba(255,255,255,0.04) 45deg, transparent 90deg, transparent 250deg, rgba(255,255,255,0.06) 290deg, rgba(255,255,255,0.12) 320deg, transparent 355deg);
  z-index: 5;
}

.record-gloss::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.01) 25%, transparent 50%, rgba(255,255,255,0.02) 75%, rgba(255,255,255,0.07) 100%);
}

/* ==================== Progress Bar ==================== */
.progress-bar {
  position: absolute;
  bottom: max(50px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  width: 70%;
  max-width: 320px;
  height: 24px;
  z-index: 10;
  display: flex;
  align-items: center;
  cursor: pointer;
  touch-action: none;
}

.progress-track {
  width: 100%;
  height: 3px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px;
  position: relative;
  overflow: visible;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  border-radius: 2px;
  transition: width 0.15s linear;
  box-shadow: 0 0 6px var(--accent-dim);
  position: relative;
}

.progress-fill::after {
  content: '';
  position: absolute;
  right: -7px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px rgba(212, 175, 55, 0.6), 0 2px 4px rgba(0,0,0,0.3);
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
}

.progress-bar.dragging .progress-fill::after,
.progress-bar:active .progress-fill::after {
  opacity: 1;
  transform: translateY(-50%) scale(1.3);
}

.progress-bar.dragging .progress-fill {
  transition: none;
}

/* Seek time display */
.seek-display {
  position: absolute;
  bottom: max(80px, calc(env(safe-area-inset-bottom) + 30px));
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  letter-spacing: 1px;
  z-index: 10;
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
  white-space: nowrap;
}

.seek-display.show {
  opacity: 1;
}

/* ==================== Mode Indicator ==================== */
.mode-indicator {
  position: absolute;
  bottom: max(20px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: var(--text-dim);
  z-index: 10;
  letter-spacing: 3px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.mode-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-dim);
  transition: all 0.3s;
}

.mode-dot.active {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

/* ==================== Toast ==================== */
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: var(--text);
  padding: 10px 28px;
  border-radius: 22px;
  font-size: 14px;
  opacity: 0;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
  z-index: 200;
  border: 1px solid rgba(255, 255, 255, 0.06);
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ==================== Shared Panel (List + Settings) ==================== */
.slide-panel {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at 50% 0%, var(--bg-mid) 0%, var(--bg-base) 40%, #050505 100%);
  z-index: 50;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  will-change: transform;
}

.slide-panel.show {
  transform: translateX(0);
}

.panel-header {
  display: flex;
  align-items: center;
  padding: max(20px, env(safe-area-inset-top)) 24px 16px;
  gap: 16px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
}

.back-btn {
  width: 0;
  height: 0;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-right: 13px solid var(--accent);
  cursor: pointer;
  transition: all 0.2s;
  filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.3));
  flex-shrink: 0;
}

.back-btn:active {
  transform: scale(0.85);
}

.panel-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 3px;
}

/* ==================== Category Bar ==================== */
.category-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px 8px;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  flex-shrink: 0;
  touch-action: pan-x;
}

.category-bar::-webkit-scrollbar { display: none; }

.category-pill {
  flex-shrink: 0;
  padding: 7px 18px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-dim);
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  touch-action: manipulation;
}

.category-pill.active {
  background: rgba(212, 175, 55, 0.12);
  border-color: var(--accent-dim);
  color: var(--accent);
}

.category-pill:active { transform: scale(0.95); }

.category-add {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px dashed var(--accent-dim);
  background: transparent;
  color: var(--accent);
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  line-height: 1;
}

.category-add:active { transform: scale(0.9); background: rgba(212, 175, 55, 0.1); }

/* ==================== Action Buttons ==================== */
.list-actions {
  display: flex;
  gap: 12px;
  padding: 8px 24px 12px;
  flex-shrink: 0;
}

.action-btn {
  flex: 1;
  padding: 13px 8px;
  border: 1px solid var(--accent-dim);
  border-radius: 12px;
  background: rgba(212, 175, 55, 0.04);
  color: var(--accent);
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  letter-spacing: 1px;
}

.action-btn:active { background: rgba(212, 175, 55, 0.15); transform: scale(0.97); }
.action-icon { font-size: 16px; line-height: 1; }

/* ==================== Track List ==================== */
.track-list-wrapper {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 0;
  min-height: 0;
  position: relative;
}

.track-list { padding: 4px 0 60px; }

.track-item {
  position: relative;
  overflow: hidden;
  touch-action: none;
  -webkit-touch-callout: none;
}

.track-actions {
  position: absolute;
  top: 0;
  right: 0;
  height: 100%;
  display: flex;
  z-index: 1;
  touch-action: manipulation;
}

.track-action {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 72px;
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  letter-spacing: 1px;
  transition: filter 0.2s;
  touch-action: manipulation;
}

.track-action:active { filter: brightness(0.85); }
.track-action.edit { background: var(--edit-blue); }
.track-action.delete { background: var(--delete-red); }

.track-item-content {
  position: relative;
  z-index: 2;
  background: var(--bg-base);
  display: flex;
  align-items: center;
  padding: 13px 24px;
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  will-change: transform;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  cursor: pointer;
  touch-action: none;
  -webkit-touch-callout: none;
}

.track-item.dragging-mode .track-actions {
  display: none;
}

.track-item-content.dragging {
  transition: none;
  z-index: 100;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(212, 175, 55, 0.3);
  background: #1a1a1a;
  opacity: 0.95;
  border-radius: 8px;
  touch-action: none;
}

.track-item.dragging-mode .track-item-content {
  border-bottom: none;
}

.track-item-content.revealed { transform: translateX(-144px); }
.track-item-content.near-revealed { transform: translateX(-72px); }

.track-item.active .track-item-content { color: var(--accent); }
.track-item.active .track-number { color: var(--accent); }

.track-number {
  width: 32px;
  text-align: center;
  color: var(--text-dim);
  font-size: 14px;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.track-info-cell { flex: 1; min-width: 0; }

.track-name {
  font-size: 15px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 2px;
}

.track-type { font-size: 11px; color: var(--text-dim); }
.track-type.video { color: rgba(212, 175, 55, 0.5); }

.track-drag-handle {
  color: rgba(255, 255, 255, 0.15);
  font-size: 16px;
  padding: 0 4px;
  flex-shrink: 0;
  touch-action: none;
  cursor: grab;
}

.empty-list {
  text-align: center;
  color: var(--text-dim);
  padding: 50px 0;
  font-size: 14px;
}

.empty-list .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.15; }

/* ==================== Settings View ==================== */
.settings-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px 24px 60px;
}

.settings-section {
  margin-bottom: 32px;
}

.settings-section-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 2px;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(212, 175, 55, 0.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: opacity 0.2s;
}

.settings-section-title:active { opacity: 0.6; }

.settings-section-title .arrow {
  font-size: 14px;
  transition: transform 0.3s ease;
}

.settings-section.collapsed .arrow { transform: rotate(-90deg); }

.settings-section-body {
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.3s ease;
  max-height: 2000px;
  opacity: 1;
}

.settings-section.collapsed .settings-section-body {
  max-height: 0;
  opacity: 0;
}

.settings-row {
  margin-bottom: 24px;
}

.settings-label {
  font-size: 14px;
  color: var(--text);
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.color-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}

.color-swatch {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid rgba(255, 255, 255, 0.1);
  transition: all 0.2s;
  position: relative;
  flex-shrink: 0;
}

.color-swatch:active { transform: scale(0.9); }

.color-swatch.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
  transform: scale(1.1);
}

.color-swatch.selected::after {
  content: '✓';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

.color-custom-wrap {
  position: relative;
  width: 40px;
  height: 40px;
  flex-shrink: 0;
}

.color-custom {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px dashed var(--accent-dim);
  cursor: pointer;
  background: transparent;
  -webkit-appearance: none;
  appearance: none;
  padding: 0;
  overflow: hidden;
}

.color-custom::-webkit-color-swatch-wrapper { padding: 0; }
.color-custom::-webkit-color-swatch { border: none; border-radius: 50%; }
.color-custom::-moz-color-swatch { border: none; border-radius: 50%; }

<script>
'use strict';

// ==================== State ====================
let nextTrackId = 1;
let nextCategoryId = 1;

let categories = [
  { id: 'cat-0', name: '默认' }
];

let tracks = [
  { id: 0, name: 'SoundHelix Song 1', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', type: 'audio', categoryId: 'cat-0' },
  { id: 1, name: 'SoundHelix Song 2', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', type: 'audio', categoryId: 'cat-0' },
  { id: 2, name: 'SoundHelix Song 3', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3', type: 'audio', categoryId: 'cat-0' },
];
nextTrackId = 3;
nextCategoryId = 1;

let currentCategoryId = 'cat-0';
let currentIndex = 0;
let isPlaying = false;
let playMode = 'sequence';
let currentMedia = null;

// ==================== 数据持久化 (IndexedDB + localStorage) ====================
// 确保退出软件、息屏、切后台后数据不丢失，只有卸载才会清除
let _db = null;
const DB_NAME = 'yingu_player_db';
const DB_STORE = 'files';
const LS_KEY = 'yingu_player_data';

// 打开 IndexedDB
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(DB_STORE)) {
        db.createObjectStore(DB_STORE);
      }
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = e => reject(e.target.error);
  });
}

// 存储文件到 IndexedDB
function dbPut(key, blob) {
  return new Promise((resolve, reject) => {
    if (!_db) return reject('DB not open');
    const tx = _db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(blob, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// 从 IndexedDB 读取文件
function dbGet(key) {
  return new Promise((resolve, reject) => {
    if (!_db) return reject('DB not open');
    const tx = _db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// 从 IndexedDB 删除文件
function dbDelete(key) {
  return new Promise((resolve, reject) => {
    if (!_db) return reject('DB not open');
    const tx = _db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// 防抖保存
let _saveTimer = null;
function saveAllData() {
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(_doSave, 500);
}

function _doSave() {
  try {
    // 序列化 tracks，把 blob: URL 替换为 fileKey 引用
    const tracksData = tracks.map(t => {
      const copy = { ...t };
      if (copy.src && copy.src.startsWith('blob:')) {
        // blob URL 对应的 fileKey 已在添加时存入 IndexedDB
        // 用 fileKey 标记替代 blob URL
        if (copy._fileKey) {
          copy.src = 'idb:' + copy._fileKey;
        }
        delete copy._fileKey;
      }
      return copy;
    });

    // 序列化 settings 中的 blob URL 图片
    const settingsData = {
      bgColor: settings.bgColor,
      bgOpacity: settings.bgOpacity,
      recordColor: settings.recordColor,
      recordOpacity: settings.recordOpacity,
      labelColor: settings.labelColor,
      labelOpacity: settings.labelOpacity,
      bgImageIndex: settings.bgImageIndex,
      recordImageIndex: settings.recordImageIndex,
      labelImageIndex: settings.labelImageIndex,
      bgOpacityImage: settings.bgOpacityImage,
      recordOpacityImage: settings.recordOpacityImage,
      labelOpacityImage: settings.labelOpacityImage,
      bgImages: settings.bgImages.map((item, i) => {
        const url = typeof item === 'string' ? item : (item && item.url);
        if (url && url.startsWith('blob:')) {
          const key = typeof item === 'object' && item._fileKey ? item._fileKey : 'img-bg-' + i;
          return 'idb:' + key;
        }
        return url || '';
      }),
      recordImages: settings.recordImages.map((item, i) => {
        const url = typeof item === 'string' ? item : (item && item.url);
        if (url && url.startsWith('blob:')) {
          const key = typeof item === 'object' && item._fileKey ? item._fileKey : 'img-rec-' + i;
          return 'idb:' + key;
        }
        return url || '';
      }),
      labelImages: settings.labelImages.map((item, i) => {
        const url = typeof item === 'string' ? item : (item && item.url);
        if (url && url.startsWith('blob:')) {
          const key = typeof item === 'object' && item._fileKey ? item._fileKey : 'img-lbl-' + i;
          return 'idb:' + key;
        }
        return url || '';
      })
    };

    const data = {
      tracks: tracksData,
      categories: categories,
      nextTrackId: nextTrackId,
      nextCategoryId: nextCategoryId,
      currentCategoryId: currentCategoryId,
      currentIndex: currentIndex,
      playMode: playMode,
      settings: settingsData,
      version: 2
    };

    localStorage.setItem(LS_KEY, JSON.stringify(data));
    console.log('[持久化] 数据已保存:', tracksData.length, '首曲目');
  } catch (e) {
    console.error('[持久化] 保存失败:', e);
  }
}

// 加载持久化数据
async function loadAllData() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) {
      console.log('[持久化] 无历史数据，使用默认');
      return false;
    }

    const data = JSON.parse(raw);
    if (!data || !data.tracks) return false;

    // 恢复分类
    if (data.categories && Array.isArray(data.categories)) {
      categories = data.categories;
    }
    if (data.nextTrackId) nextTrackId = data.nextTrackId;
    if (data.nextCategoryId) nextCategoryId = data.nextCategoryId;
    if (data.currentCategoryId) currentCategoryId = data.currentCategoryId;
    if (data.playMode) playMode = data.playMode;

    // 恢复 tracks，把 idb: 引用转回 blob URL
    tracks = [];
    for (const t of data.tracks) {
      const track = { ...t };
      if (track.src && track.src.startsWith('idb:')) {
        const fileKey = track.src.substring(4);
        try {
          const blob = await dbGet(fileKey);
          if (blob) {
            track.src = URL.createObjectURL(blob);
            track._fileKey = fileKey;
          } else {
            console.warn('[持久化] 文件未找到:', fileKey);
            track.src = ''; // 文件丢失，置空
          }
        } catch (e) {
          console.warn('[持久化] 读取文件失败:', fileKey, e);
          track.src = '';
        }
      }
      tracks.push(track);
    }

    // 恢复 settings
    if (data.settings) {
      const s = data.settings;
      if (s.bgColor) settings.bgColor = s.bgColor;
      if (s.bgOpacity !== undefined) settings.bgOpacity = s.bgOpacity;
      if (s.recordColor) settings.recordColor = s.recordColor;
      if (s.recordOpacity !== undefined) settings.recordOpacity = s.recordOpacity;
      if (s.labelColor) settings.labelColor = s.labelColor;
      if (s.labelOpacity !== undefined) settings.labelOpacity = s.labelOpacity;
      if (s.bgImageIndex !== undefined) settings.bgImageIndex = s.bgImageIndex;
      if (s.recordImageIndex !== undefined) settings.recordImageIndex = s.recordImageIndex;
      if (s.labelImageIndex !== undefined) settings.labelImageIndex = s.labelImageIndex;
      if (s.bgOpacityImage !== undefined) settings.bgOpacityImage = s.bgOpacityImage;
      if (s.recordOpacityImage !== undefined) settings.recordOpacityImage = s.recordOpacityImage;
      if (s.labelOpacityImage !== undefined) settings.labelOpacityImage = s.labelOpacityImage;

      // 恢复图片
      if (s.bgImages) {
        settings.bgImages = [];
        for (let i = 0; i < s.bgImages.length; i++) {
          const ref = s.bgImages[i];
          if (ref && ref.startsWith('idb:')) {
            try {
              const blob = await dbGet(ref.substring(4));
              settings.bgImages.push(blob ? { url: URL.createObjectURL(blob), _fileKey: ref.substring(4) } : { url: '', _fileKey: null });
            } catch (e) { settings.bgImages.push({ url: '', _fileKey: null }); }
          } else {
            settings.bgImages.push(ref);
          }
        }
      }
      if (s.recordImages) {
        settings.recordImages = [];
        for (let i = 0; i < s.recordImages.length; i++) {
          const ref = s.recordImages[i];
          if (ref && ref.startsWith('idb:')) {
            try {
              const blob = await dbGet(ref.substring(4));
              settings.recordImages.push(blob ? { url: URL.createObjectURL(blob), _fileKey: ref.substring(4) } : { url: '', _fileKey: null });
            } catch (e) { settings.recordImages.push({ url: '', _fileKey: null }); }
          } else {
            settings.recordImages.push(ref);
          }
        }
      }
      if (s.labelImages) {
        settings.labelImages = [];
        for (let i = 0; i < s.labelImages.length; i++) {
          const ref = s.labelImages[i];
          if (ref && ref.startsWith('idb:')) {
            try {
              const blob = await dbGet(ref.substring(4));
              settings.labelImages.push(blob ? { url: URL.createObjectURL(blob), _fileKey: ref.substring(4) } : { url: '', _fileKey: null });
            } catch (e) { settings.labelImages.push({ url: '', _fileKey: null }); }
          } else {
            settings.labelImages.push(ref);
          }
        }
      }
    }

    // 恢复播放位置（不自动播放，只恢复索引）
    if (data.currentIndex !== undefined && data.currentIndex < tracks.length) {
      currentIndex = data.currentIndex;
    }

    console.log('[持久化] 数据已恢复:', tracks.length, '首曲目');
    return true;
  } catch (e) {
    console.error('[持久化] 加载失败:', e);
    return false;
  }
}

// ==================== Color Helpers ====================
function adjustColor(hex, amount) {
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  r = Math.max(0, Math.min(255, r + amount));
  g = Math.max(0, Math.min(255, g + amount));
  b = Math.max(0, Math.min(255, b + amount));
  return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
}

function hexToRgba(hex, alpha) {
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function applySettings() {
  const root = document.documentElement;
  root.style.setProperty('--bg-base', settings.bgColor);
  root.style.setProperty('--bg-mid', adjustColor(settings.bgColor, 16));
  root.style.setProperty('--record-base', settings.recordColor);
  root.style.setProperty('--record-mid', adjustColor(settings.recordColor, 14));
  root.style.setProperty('--record-light', adjustColor(settings.recordColor, 28));
  root.style.setProperty('--label-color', settings.labelColor);
  root.style.setProperty('--label-light', adjustColor(settings.labelColor, 18));
  root.style.setProperty('--label-dark', adjustColor(settings.labelColor, -30));

  const playerView = document.getElementById('player-view');

  // Background image with opacity
  if (settings.bgImages.length > 0 && settings.bgImageIndex >= 0 && settings.bgImageIndex < settings.bgImages.length) {
    const imgItem = settings.bgImages[settings.bgImageIndex];
    const imgUrl = typeof imgItem === 'string' ? imgItem : imgItem.url;
    const imgOpacity = settings.bgOpacityImage;
    playerView.style.background = `linear-gradient(rgba(0,0,0,${1 - imgOpacity}), rgba(0,0,0,${1 - imgOpacity + 0.1})), url('${imgUrl}') center / cover no-repeat`;
  } else {
    // Background color with opacity
    const bgAlpha = settings.bgOpacity;
    const bgColorRgba = hexToRgba(settings.bgColor, bgAlpha);
    const bgMidRgba = hexToRgba(adjustColor(settings.bgColor, 16), bgAlpha);
    playerView.style.background = `radial-gradient(ellipse at 50% 45%, ${bgMidRgba} 0%, ${bgColorRgba} 50%, rgba(5,5,5,${bgAlpha}) 100%)`;
  }

  // Record opacity
  record.style.opacity = settings.recordOpacity;

  // Label opacity
  document.getElementById('recordLabel').style.opacity = settings.labelOpacity;

  // Record image overlay
  const recordImgEl = document.getElementById('recordImageOverlay');
  if (recordImgEl) {
    if (settings.recordImages.length > 0 && settings.recordImageIndex >= 0 && settings.recordImageIndex < settings.recordImages.length) {
      const recItem = settings.recordImages[settings.recordImageIndex];
      const recUrl = typeof recItem === 'string' ? recItem : recItem.url;
      recordImgEl.style.backgroundImage = `url('${recUrl}')`;
      recordImgEl.style.opacity = settings.recordOpacityImage;
      recordImgEl.style.display = 'block';
    } else {
      recordImgEl.style.display = 'none';
    }
  }

  // Label image overlay
  const labelImgEl = document.getElementById('labelImageOverlay');
  if (labelImgEl) {
    if (settings.labelImages.length > 0 && settings.labelImageIndex >= 0 && settings.labelImageIndex < settings.labelImages.length) {
      const lblItem = settings.labelImages[settings.labelImageIndex];
      const lblUrl = typeof lblItem === 'string' ? lblItem : lblItem.url;
      labelImgEl.style.backgroundImage = `url('${lblUrl}')`;
      labelImgEl.style.opacity = settings.labelOpacityImage;
      labelImgEl.style.display = 'block';
    } else {
      labelImgEl.style.display = 'none';
    }
  }

  // Update UI in settings
  renderImageGrid('bgImageGrid', settings.bgImages, 'bgImageIndex', 'bgImageInput', '背景图片');
  renderImageGrid('recordImageGrid', settings.recordImages, 'recordImageIndex', 'recordImageInput', '唱片图片');
  renderImageGrid('labelImageGrid', settings.labelImages, 'labelImageIndex', 'labelImageInput', '标签图片');
  updateAllOpacityValues();
}

function updateAllOpacityValues() {
  const map = [
    ['bgOpacitySlider', 'bgOpacityValue', settings.bgOpacity],
    ['recordOpacitySlider', 'recordOpacityValue', settings.recordOpacity],
    ['labelOpacitySlider', 'labelOpacityValue', settings.labelOpacity],
    ['opacitySlider', 'opacityValue', settings.bgOpacityImage],
    ['recordImgOpacitySlider', 'recordImgOpacityValue', settings.recordOpacityImage],
    ['labelImgOpacitySlider', 'labelImgOpacityValue', settings.labelOpacityImage],
  ];
  map.forEach(([sliderId, valueId, val]) => {
    const slider = document.getElementById(sliderId);
    const label = document.getElementById(valueId);
    if (slider) slider.value = Math.round(val * 100);
    if (label) label.textContent = Math.round(val * 100) + '%';
  });
}

function renderImageGrid(gridId, images, indexKey, inputId, labelName) {
  const grid = document.getElementById(gridId);
  if (!grid) return;
  grid.innerHTML = '';

  const opacityRowMap = {
    'bgImageGrid': 'bgOpacityRow',
    'recordImageGrid': 'recordImgOpacityRow',
    'labelImageGrid': 'labelImgOpacityRow'
  };
  const opacityRow = document.getElementById(opacityRowMap[gridId]);

  images.forEach((imgUrl, idx) => {
    const item = document.createElement('div');
    item.className = 'bg-image-preview' + (idx === settings[indexKey] ? ' selected' : '');
    item.style.backgroundImage = `url('${imgUrl}')`;

    const removeMini = document.createElement('div');
    removeMini.className = 'remove-mini';
    removeMini.textContent = '×';
    removeMini.addEventListener('click', async (e) => {
      e.stopPropagation();
      const confirmed = await showModal({
        title: `移除${labelName}`,
        bodyHTML: `确定要移除这张${labelName}吗？`,
        buttons: [
          { text: '取消', value: false, style: 'cancel' },
          { text: '移除', value: true, style: 'danger' }
        ]
      });
      if (!confirmed) return;
      if (imgUrl.startsWith('blob:')) URL.revokeObjectURL(imgUrl);
      images.splice(idx, 1);
      if (settings[indexKey] >= images.length) {
        settings[indexKey] = images.length - 1;
      }
      applySettings();
      showToast('图片已移除');
    });
    item.appendChild(removeMini);

    item.addEventListener('click', () => {
      settings[indexKey] = idx;
      applySettings();
    });

    grid.appendChild(item);
  });

  // Add the "+" button at the end
  const addBtn = document.createElement('div');
  addBtn.className = 'bg-image-preview';
  const plus = document.createElement('span');
  plus.className = 'placeholder';
  plus.textContent = '+';
  addBtn.appendChild(plus);
  addBtn.addEventListener('click', () => {
    document.getElementById(inputId).click();
  });
  grid.appendChild(addBtn);

  // Show/hide opacity slider
  if (opacityRow) {
    opacityRow.style.display = (images.length > 0) ? '' : 'none';
  }
}

const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const modalActions = document.getElementById('modalActions');

function showModal({ title, bodyHTML, buttons }) {
  return new Promise(resolve => {
    modalTitle.textContent = title || '提示';
    modalBody.innerHTML = bodyHTML || '';
    modalActions.innerHTML = '';
    buttons.forEach(btn => {
      const el = document.createElement('button');
      el.className = `modal-btn ${btn.style || ''}`;
      el.textContent = btn.text;
      el.addEventListener('click', () => {
        const result = btn.onClick ? btn.onClick() : btn.value;
        closeModal();
        resolve(result);
      });
      modalActions.appendChild(el);
    });
    modalOverlay.classList.add('show');
    const input = modalBody.querySelector('input');
    if (input) {
      setTimeout(() => input.focus(), 300);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          const confirmBtn = modalActions.querySelector('.confirm');
          if (confirmBtn) confirmBtn.click();
        }
      });
    }
  });
}

function closeModal() { modalOverlay.classList.remove('show'); }
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

// ==================== Time Format ====================
function formatTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// ==================== Artwork Generation ====================
function generateArtwork() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = settings.bgColor;
  ctx.fillRect(0, 0, 512, 512);
  const cx = 256, cy = 256, r = 210;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(cx - 40, cy - 40, 20, cx, cy, r);
  grad.addColorStop(0, adjustColor(settings.recordColor, 28));
  grad.addColorStop(0.5, settings.recordColor);
  grad.addColorStop(1, settings.recordColor);
  ctx.fillStyle = grad;
  ctx.fill();
  for (let i = 80; i < r; i += 3) {
    ctx.beginPath();
    ctx.arc(cx, cy, i, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(cx, cy, 76, 0, Math.PI * 2);
  const labelGrad = ctx.createRadialGradient(cx - 15, cy - 15, 5, cx, cy, 76);
  labelGrad.addColorStop(0, adjustColor(settings.labelColor, 18));
  labelGrad.addColorStop(0.5, settings.labelColor);
  labelGrad.addColorStop(1, adjustColor(settings.labelColor, -30));
  ctx.fillStyle = labelGrad;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.fillStyle = '#f5e6d3';
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('音轨', cx, cy + 35);
  ctx.font = '10px sans-serif';
  ctx.fillStyle = 'rgba(255,230,210,0.5)';
  ctx.fillText('YINGU', cx, cy + 50);
  return canvas.toDataURL('image/png');
}

// ==================== Media Session API ====================
// ==================== Background Audio Keep-Alive (息屏后播放不中断) ====================
let wakeLock = null;
let silentAudioCtx = null;
let silentSource = null;
let keepAliveTimer = null;

// 创建一个静音的 Web Audio 振荡器，防止浏览器在后台时暂停音频
function startSilentKeepAlive() {
  try {
    if (!silentAudioCtx && 'AudioContext' in window) {
      silentAudioCtx = new AudioContext();
      // 创建一个几乎静音的振荡器（0.001振幅，人耳不可听）
      silentSource = silentAudioCtx.createOscillator();
      const gain = silentAudioCtx.createGain();
      gain.gain.value = 0.001;
      silentSource.frequency.value = 1;
      silentSource.connect(gain);
      gain.connect(silentAudioCtx.destination);
      silentSource.start();
    }
    // 如果上下文被浏览器挂起，尝试恢复
    if (silentAudioCtx && silentAudioCtx.state === 'suspended') {
      silentAudioCtx.resume();
    }
  } catch (e) {
    console.warn('Silent keep-alive failed:', e);
  }
}

function stopSilentKeepAlive() {
  if (silentSource) {
    try { silentSource.stop(); } catch (e) {}
    silentSource = null;
  }
  if (silentAudioCtx) {
    try { silentAudioCtx.close(); } catch (e) {}
    silentAudioCtx = null;
  }
}

// 启动定期保活定时器 - 每30秒通知 Native 服务保持播放
function startKeepAliveTimer() {
  stopKeepAliveTimer();
  keepAliveTimer = setInterval(() => {
    if (isPlaying && window.YinguMusic) {
      try {
        var name = tracks[currentIndex] ? tracks[currentIndex].name : '音轨';
        YinguMusic.updatePlayback(true, name, currentIndex + 1, tracks.length);
      } catch (e) {}
    }
    // 恢复 AudioContext（WebView 后台可能挂起）
    if (silentAudioCtx && silentAudioCtx.state === 'suspended') {
      silentAudioCtx.resume();
    }
    // 确保音频在播放
    if (isPlaying && currentMedia && currentMedia.paused) {
      currentMedia.play().catch(function() {});
    }
  }, 30000);
}

function stopKeepAliveTimer() {
  if (keepAliveTimer) {
    clearInterval(keepAliveTimer);
    keepAliveTimer = null;
  }
}

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
      });
    }
  } catch (e) {
    console.warn('Wake Lock request failed:', e);
  }
}

function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release();
    wakeLock = null;
  }
}

// 页面可见性变化 - 恢复 Wake Lock 和静音保活
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && isPlaying) {
    requestWakeLock();
    startSilentKeepAlive();
    // 恢复后确保音频继续播放
    if (currentMedia && currentMedia.paused) {
      currentMedia.play().catch(function() {});
    }
  }
});

// Cordova 生命周期 - pause 事件（息屏/切后台时触发）
// 在 Cordova WebView 中，这个事件比 visibilitychange 更可靠
if (window.cordova) {
  document.addEventListener('pause', () => {
    // 息屏/切后台时：确保 Native 服务知道我们在播放
    if (isPlaying && window.YinguMusic) {
      try {
        var name = tracks[currentIndex] ? tracks[currentIndex].name : '音轨';
        YinguMusic.updatePlayback(true, name, currentIndex + 1, tracks.length);
      } catch (e) {}
    }
    // 保持静音保活运行（不停止）
    // WakeLock 在 WebView 中会被自动释放，但 Native 服务的 WakeLock 会保持
  }, false);

  document.addEventListener('resume', () => {
    // 从后台恢复时：重新获取 WakeLock、恢复 AudioContext
    if (isPlaying) {
      requestWakeLock();
      startSilentKeepAlive();
      if (currentMedia && currentMedia.paused) {
        currentMedia.play().catch(function() {});
      }
      updateMediaSession();
    }
  }, false);
}

// 页面生命周期 - 处理 freeze/resume 事件
document.addEventListener('freeze', () => {
  // 页面被浏览器冻结前，确保 Media Session 状态正确
  if ('mediaSession' in navigator) {
    navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
  }
});

document.addEventListener('resume', () => {
  // 页面从冻结状态恢复
  if (isPlaying) {
    requestWakeLock();
    startSilentKeepAlive();
    // 确保 Media Session 仍然有效
    updateMediaSession();
  }
});

// pagehide - 确保后台播放状态正确
window.addEventListener('pagehide', (event) => {
  if (isPlaying) {
    // 确保浏览器知道我们正在播放，应该在后台继续
    if ('mediaSession' in navigator) {
      navigator.mediaSession.playbackState = 'playing';
    }
  }
});

window.addEventListener('pageshow', (event) => {
  if (event.persisted && isPlaying) {
    requestWakeLock();
    startSilentKeepAlive();
    updateMediaSession();
  }
});

function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.setActionHandler('play', () => play());
  navigator.mediaSession.setActionHandler('pause', () => pause());
  navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
  navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
  navigator.mediaSession.setActionHandler('seekbackward', (details) => {
    if (currentMedia && currentMedia.duration) {
      currentMedia.currentTime = Math.max(0, currentMedia.currentTime - (details.seekOffset || 10));
      updateProgress();
    }
  });
  navigator.mediaSession.setActionHandler('seekforward', (details) => {
    if (currentMedia && currentMedia.duration) {
      currentMedia.currentTime = Math.min(currentMedia.duration, currentMedia.currentTime + (details.seekOffset || 10));
      updateProgress();
    }
  });
  navigator.mediaSession.setActionHandler('seekto', (details) => {
    if (currentMedia && currentMedia.duration && details.seekTime !== undefined) {
      currentMedia.currentTime = Math.min(currentMedia.duration, Math.max(0, details.seekTime));
      updateProgress();
    }
  });
  navigator.mediaSession.setActionHandler('stop', () => pause());
}

function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const track = tracks[currentIndex];
  if (!track) return;
  try {
    const artwork = [];
    if (artworkUrl) {
      artwork.push({ src: artworkUrl, sizes: '512x512', type: 'image/png' });
    }
    // Use record image if available
    if (settings.recordImages.length > 0 && settings.recordImageIndex >= 0) {
      const recItem = settings.recordImages[settings.recordImageIndex];
      const recUrl = typeof recItem === 'string' ? recItem : (recItem && recItem.url);
      if (recUrl) artwork.unshift({ src: recUrl, sizes: '512x512', type: 'image/jpeg' });
    }
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.name,
      artist: '音轨',
      album: categories.find(c => c.id === track.categoryId)?.name || '音轨',
      artwork: artwork.length > 0 ? artwork : [{ src: '', sizes: '512x512' }]
    });
    navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
    // Set position state for lock screen seek bar
    if ('setPositionState' in navigator.mediaSession && currentMedia && currentMedia.duration) {
      try {
        navigator.mediaSession.setPositionState({
          duration: currentMedia.duration || 0,
          position: currentMedia.currentTime || 0,
          playbackRate: 1
        });
      } catch (e) {}
    }
  } catch (e) {}
}

// ==================== Rotation Animation ====================
function animateRotation() {
  rotationSpeed += (targetSpeed - rotationSpeed) * ACCEL_FACTOR;
  rotationAngle += rotationSpeed;
  if (rotationAngle >= 360) rotationAngle -= 360;
  if (rotationAngle < 0) rotationAngle += 360;
  record.style.transform = `rotate(${rotationAngle}deg)`;
  if (isPlaying || Math.abs(rotationSpeed) > 0.05) {
    requestAnimationFrame(animateRotation);
  } else {
    animating = false;
    rotationSpeed = 0;
  }
}

function startAnimation() {
  if (!animating) {
    animating = true;
    requestAnimationFrame(animateRotation);
  }
}

// ==================== Playback ====================
function loadTrack(index) {
  if (tracks.length === 0) {
    labelText.textContent = '音轨';
    return;
  }
  currentIndex = ((index % tracks.length) + tracks.length) % tracks.length;
  const track = tracks[currentIndex];
  const prevMedia = currentMedia;
  if (track.type === 'video') currentMedia = videoPlayer;
  else currentMedia = audioPlayer;
  if (prevMedia !== currentMedia) {
    prevMedia.pause();
    prevMedia.currentTime = 0;
  }
  currentMedia.src = track.src;
  currentMedia.load();
  labelText.textContent = track.name;
  updateTrackList();
  updateMediaSession();
  updateProgress();
  saveAllData(); // 保存当前播放位置
}

function play() {
  if (tracks.length === 0) { showToast('请先添加曲目'); return; }
  isPlaying = true;
  targetSpeed = PLAY_SPEED;
  startAnimation();
  // 先更新 Media Session 元数据（让浏览器知道这是媒体应用，息屏后应继续播放）
  updateMediaSession();
  // 请求屏幕常亮锁
  requestWakeLock();
  // 启动静音保活（防止浏览器在后台挂起音频上下文）
  startSilentKeepAlive();
  // 启动定期保活定时器（每30秒检查并恢复播放）
  startKeepAliveTimer();
  // 设置播放状态
  if ('mediaSession' in navigator) {
    navigator.mediaSession.playbackState = 'playing';
  }
  // 播放音频
  const playPromise = currentMedia.play();
  if (playPromise && playPromise.catch) {
    playPromise.catch(() => { showToast('播放失败'); pause(); });
  }
  updateTrackList();
}

function pause() {
  isPlaying = false;
  targetSpeed = 0;
  startAnimation();
  releaseWakeLock();
  // 停止定期保活定时器
  stopKeepAliveTimer();
  // 注意：暂停时不停止静音保活，避免播放状态切换导致后台音频中断
  // 仅在完全停止时才停止
  currentMedia.pause();
  if ('mediaSession' in navigator) {
    navigator.mediaSession.playbackState = 'paused';
  }
  updateTrackList();
  updateMediaSession();
}

function togglePlay() {
  if (isPlaying) pause(); else play();
}

function nextTrack() {
  if (tracks.length === 0) return;
  if (playMode === 'shuffle') {
    let next;
    do { next = Math.floor(Math.random() * tracks.length); }
    while (next === currentIndex && tracks.length > 1);
    loadTrack(next);
  } else {
    loadTrack(currentIndex + 1);
  }
  if (isPlaying) play();
}

function prevTrack() {
  if (tracks.length === 0) return;
  if (currentMedia.currentTime > 3) {
    currentMedia.currentTime = 0;
  } else {
    loadTrack(currentIndex - 1);
  }
  if (isPlaying) play();
}

function onMediaEnded() {
  if (playMode === 'shuffle') { nextTrack(); }
  else {
    if (currentIndex < tracks.length - 1) { loadTrack(currentIndex + 1); play(); }
    else { pause(); loadTrack(0); }
  }
}

function onMediaError() { showToast('无法播放此曲目'); loadingRing.classList.remove('show'); pause(); }
function onMediaWaiting() { loadingRing.classList.add('show'); }
function onMediaPlaying() { loadingRing.classList.remove('show'); }

[audioPlayer, videoPlayer].forEach(el => {
  el.addEventListener('ended', onMediaEnded);
  el.addEventListener('error', onMediaError);
  el.addEventListener('waiting', onMediaWaiting);
  el.addEventListener('playing', onMediaPlaying);
  el.addEventListener('canplay', () => loadingRing.classList.remove('show'));
  el.addEventListener('timeupdate', updateProgress);
  el.addEventListener('loadedmetadata', updateProgress);
});

// ==================== Play Mode ====================
function togglePlayMode() {
  if (playMode === 'sequence') {
    playMode = 'shuffle';
    modeText.textContent = '随机播放';
    modeDot1.classList.add('active');
    modeDot2.classList.add('active');

    modeDot1.classList.remove('active');
    modeDot2.classList.remove('active');
    showToast('顺序播放');
  }
  updateTrackList();
  saveAllData();
}

// ==================== Record Gestures (Tap + Swipe) ====================
let clickTimer = null;
let touchHandled = false;
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
let recordGesture = 'pending'; // 'pending' | 'swipe' | 'tap'

record.addEventListener('click', () => {
  if (touchHandled) return;
  handleTap();
});

recordWrap.addEventListener('touchstart', e => {
  if (e.touches.length > 1) return;
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchStartTime = Date.now();
  recordGesture = 'pending';
}, { passive: true });

recordWrap.addEventListener('touchmove', e => {
  if (recordGesture === 'swipe') return;

  const t = e.touches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);

  if (recordGesture === 'pending') {
    if (absDx > 50 && absDx > absDy * 1.5) {
      recordGesture = 'swipe';
    }
  }
}, { passive: true });

recordWrap.addEventListener('touchend', e => {
  touchHandled = true;
  setTimeout(() => { touchHandled = false; }, 350);

  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);

  if (recordGesture === 'swipe') {
    if (dx > 0) { prevTrack(); showToast('上一曲'); }
    else { nextTrack(); showToast('下一曲'); }
    recordGesture = 'pending';
    return;
  }

  // Tap detection
  if (absDx < 12 && absDy < 12 && dt < 300) {
    handleTap();
  }
  recordGesture = 'pending';
}, { passive: true });

// Mouse support for desktop
let mouseDownX = 0, mouseDownY = 0, mouseDown = false;
let mouseGesture = 'pending';

recordWrap.addEventListener('mousedown', e => {
  if (touchHandled) return;
  mouseDown = true;
  mouseDownX = e.clientX;
  mouseDownY = e.clientY;
  mouseGesture = 'pending';
});

window.addEventListener('mousemove', e => {
  if (!mouseDown) return;
  if (mouseGesture === 'swipe') return;

  const dx = e.clientX - mouseDownX;
  const dy = e.clientY - mouseDownY;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);

  if (mouseGesture === 'pending') {
    if (absDx > 60 && absDx > absDy * 1.5) {
      mouseGesture = 'swipe';
    }
  }
});

window.addEventListener('mouseup', e => {
  if (!mouseDown) return;
  mouseDown = false;

  if (mouseGesture === 'swipe') {
    const dx = e.clientX - mouseDownX;
    if (dx > 0) { prevTrack(); showToast('上一曲'); }
    else { nextTrack(); showToast('下一曲'); }
    mouseGesture = 'pending';
    return;
  }

  mouseGesture = 'pending';
});

function handleTap() {
  if (clickTimer) {
    clearTimeout(clickTimer);
    clickTimer = null;
    togglePlayMode();
  } else {
    clickTimer = setTimeout(() => {
      if (tracks.length === 0) { showToast('请先添加曲目'); openList(); }
      else { togglePlay(); }
      clickTimer = null;
    }, 220);
  }
}

// ==================== Progress Bar Seek (Drag to seek) ====================
let isSeeking = false;

function seekToPosition(clientX) {
  const rect = progressBar.getBoundingClientRect();
  let percent = (clientX - rect.left) / rect.width;
  percent = Math.max(0, Math.min(1, percent));
  const duration = currentMedia.duration;
  if (!duration || isNaN(duration)) return;
  const newTime = percent * duration;
  currentMedia.currentTime = newTime;
  progressFill.style.width = (percent * 100) + '%';
  seekCurrent.textContent = formatTime(newTime);
  seekDuration.textContent = formatTime(duration);
}

function showSeekBar() {
  const duration = currentMedia.duration;
  seekCurrent.textContent = formatTime(currentMedia.currentTime);
  seekDuration.textContent = formatTime(duration);
  seekDisplay.classList.add('show');
  progressBar.classList.add('dragging');
}

function hideSeekBar() {
  seekDisplay.classList.remove('show');
  progressBar.classList.remove('dragging');
}

// Touch seek
progressBar.addEventListener('touchstart', e => {
  e.preventDefault();
  isSeeking = true;
  showSeekBar();
  const t = e.touches[0];
  seekToPosition(t.clientX);
}, { passive: false });

progressBar.addEventListener('touchmove', e => {
  if (!isSeeking) return;
  e.preventDefault();
  const t = e.touches[0];
  seekToPosition(t.clientX);
}, { passive: false });

progressBar.addEventListener('touchend', e => {
  if (!isSeeking) return;
  isSeeking = false;
  hideSeekBar();
  updateProgress();
}, { passive: true });

// Mouse seek
progressBar.addEventListener('mousedown', e => {
  isSeeking = true;
  showSeekBar();
  seekToPosition(e.clientX);
});

window.addEventListener('mousemove', e => {
  if (!isSeeking) return;
  seekToPosition(e.clientX);
});

window.addEventListener('mouseup', () => {
  if (!isSeeking) return;
  isSeeking = false;
  hideSeekBar();
  updateProgress();
});

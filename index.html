<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="音轨">
<meta name="application-name" content="音轨">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="音轨 - 极简唱片音乐播放器">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">

<script src="cordova.js"></script>
<title>音轨</title>
<style>
/* ==================== Reset & Base ==================== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg-base: #0a0a0a; --bg-mid: #1a1a1a; --record-base: #030303; --record-mid: #111111;
  --record-light: #1e1e1e; --label-color: #c0392b; --label-light: #d44336; --label-dark: #7d1f12;
  --accent: #d4af37; --accent-dim: rgba(212,175,55,0.4); --text: #f0f0f0;
  --text-dim: rgba(240,240,240,0.35); --edit-blue: #3a7bd5; --delete-red: #e74c3c;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg-base); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none; position: fixed; width: 100%; touch-action: manipulation;
}
#player-view {
  height: 100vh; height: 100dvh; display: flex; flex-direction: column; position: relative;
  background: radial-gradient(ellipse at 50% 45%, var(--bg-mid) 0%, var(--bg-base) 50%, #050505 100%);
  transition: background 0.4s ease;
}
.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: max(20px, env(safe-area-inset-top)) 24px 12px; z-index: 20; flex-shrink: 0;
}
.top-left { display: flex; align-items: center; gap: 14px; }
.settings-icon {
  width: 22px; height: 22px; color: var(--accent); cursor: pointer; transition: all 0.2s; flex-shrink: 0;
}
.settings-icon:active { opacity: 0.5; transform: scale(0.9); }
.app-title {
  font-size: 17px; font-weight: 700; color: var(--accent); letter-spacing: 6px;
  text-shadow: 0 0 20px rgba(212,175,55,0.3);
}
.list-btn {
  width: 0; height: 0; border-top: 9px solid transparent; border-bottom: 9px solid transparent;
  border-left: 15px solid var(--accent); cursor: pointer; transition: all 0.2s;
  filter: drop-shadow(0 0 8px rgba(212,175,55,0.4)); padding: 0; margin-right: 4px;
}
.list-btn:active { opacity: 0.5; transform: scale(0.9); }
.record-container { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; min-height: 0; padding: 10px; }
.record-container::before {
  content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 360px; height: 360px; max-width: 95vw; max-height: 95vw; border-radius: 50%;
  background: radial-gradient(circle, #151515 0%, #0c0c0c 60%, transparent 75%);
  box-shadow: 0 0 100px rgba(0,0,0,0.6);
}
.record-wrap { position: relative; width: 320px; height: 320px; max-width: 82vw; max-height: 82vw; touch-action: none; }
@media (max-width: 400px) { .record-wrap { width: 270px; height: 270px; } }
@media (max-width: 320px) { .record-wrap { width: 230px; height: 230px; } }
.record {
  width: 100%; height: 100%; border-radius: 50%; position: relative; cursor: grab; will-change: transform;
  background:
    repeating-radial-gradient(circle at center, transparent 0, transparent 1px, rgba(255,255,255,0.028) 1px, rgba(255,255,255,0.028) 2px),
    repeating-radial-gradient(circle at center, transparent 0, transparent 3px, rgba(0,0,0,0.35) 3px, rgba(0,0,0,0.35) 4px),
    repeating-radial-gradient(circle at center, transparent 0, transparent 28px, rgba(0,0,0,0.55) 28px, rgba(0,0,0,0.55) 30px),
    radial-gradient(circle at 42% 38%, var(--record-light) 0%, var(--record-mid) 45%, var(--record-base) 85%, var(--record-base) 100%);
  box-shadow: 0 25px 70px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.04), inset 0 0 50px rgba(0,0,0,0.7), inset 0 2px 0 rgba(255,255,255,0.03);
  transition: background 0.4s ease;
}
.record::before {
  content: ''; position: absolute; inset: -2px; border-radius: 50%;
  background: linear-gradient(135deg, var(--record-light), var(--record-base) 40%, var(--record-base) 60%, var(--record-light) 100%);
  z-index: -1; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5); transition: background 0.4s ease;
}
.record-label {
  position: absolute; top: 50%; left: 50%; width: 36%; height: 36%; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--label-light) 0%, var(--label-color) 30%, var(--label-dark) 70%, var(--label-dark) 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; transform: translate(-50%,-50%);
  box-shadow: inset 0 2px 5px rgba(255,255,255,0.1), inset 0 -2px 5px rgba(0,0,0,0.3), 0 0 0 2px rgba(0,0,0,0.4), 0 0 0 3px rgba(255,255,255,0.05);
  z-index: 4; transition: background 0.4s ease;
}
.record-label::before { content: ''; position: absolute; inset: 6px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12); }
.record-label::after { content: ''; position: absolute; inset: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.06); }
.label-text {
  font-size: 13px; color: #f5e6d3; text-align: center; padding: 0 8px; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 1px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4); font-weight: 500; position: relative; z-index: 1;
}
.label-sub { font-size: 8px; color: rgba(255,230,210,0.5); letter-spacing: 2px; margin-top: 3px; position: relative; z-index: 1; }
.record-hole {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 10px; height: 10px; border-radius: 50%; background: #000;
  box-shadow: inset 0 0 3px rgba(255,255,255,0.15), 0 0 0 1px rgba(0,0,0,0.8); z-index: 6;
}
.record-image-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%;
  background-size: cover; background-position: center; display: none; z-index: 3; pointer-events: none;
}
.label-image-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%;
  background-size: cover; background-position: center; display: none; z-index: 1; pointer-events: none;
}
.record-gloss {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; pointer-events: none;
  background: conic-gradient(from 200deg, transparent 0deg, rgba(255,255,255,0.14) 15deg, rgba(255,255,255,0.04) 45deg, transparent 90deg, transparent 250deg, rgba(255,255,255,0.06) 290deg, rgba(255,255,255,0.12) 320deg, transparent 355deg);
  z-index: 5;
}
.record-gloss::before {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.01) 25%, transparent 50%, rgba(255,255,255,0.02) 75%, rgba(255,255,255,0.07) 100%);
}
.progress-bar {
  position: absolute; bottom: max(50px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  width: 70%; max-width: 320px; height: 24px; z-index: 10; display: flex; align-items: center; cursor: pointer; touch-action: none;
}
.progress-track { width: 100%; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; position: relative; overflow: visible; }
.progress-fill {
  height: 100%; background: var(--accent); width: 0%; border-radius: 2px; transition: width 0.15s linear;
  box-shadow: 0 0 6px var(--accent-dim); position: relative;
}
.progress-fill::after {
  content: ''; position: absolute; right: -7px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 10px rgba(212,175,55,0.6), 0 2px 4px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.2s, transform 0.2s;
}
.progress-bar.dragging .progress-fill::after, .progress-bar:active .progress-fill::after { opacity: 1; transform: translateY(-50%) scale(1.3); }
.progress-bar.dragging .progress-fill { transition: none; }
.seek-display {
  position: absolute; bottom: max(80px, calc(env(safe-area-inset-bottom) + 30px)); left: 50%; transform: translateX(-50%);
  font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: 1px;
  z-index: 10; opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap;
}
.seek-display.show { opacity: 1; }
.mode-indicator {
  position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  font-size: 11px; color: var(--text-dim); z-index: 10; letter-spacing: 3px; display: flex; align-items: center; gap: 6px;
}
.mode-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-dim); transition: all 0.3s; }
.mode-dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  color: var(--text); padding: 10px 28px; border-radius: 22px; font-size: 14px; opacity: 0;
  transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1); pointer-events: none; z-index: 200;
  border: 1px solid rgba(255,255,255,0.06); white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.slide-panel {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at 50% 0%, var(--bg-mid) 0%, var(--bg-base) 40%, #050505 100%);
  z-index: 50; display: flex; flex-direction: column; transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.32,0.72,0,1); will-change: transform;
}
.slide-panel.show { transform: translateX(0); }
.panel-header {
  display: flex; align-items: center; padding: max(20px, env(safe-area-inset-top)) 24px 16px;
  gap: 16px; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.03);
}
.back-btn {
  width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent;
  border-right: 13px solid var(--accent); cursor: pointer; transition: all 0.2s;
  filter: drop-shadow(0 0 6px rgba(212,175,55,0.3)); flex-shrink: 0;
}
.back-btn:active { transform: scale(0.85); }
.panel-title { font-size: 17px; font-weight: 700; color: var(--accent); letter-spacing: 3px; }
.category-bar {
  display: flex; align-items: center; gap: 8px; padding: 12px 24px 8px;
  overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  flex-shrink: 0; touch-action: pan-x;
}
.category-bar::-webkit-scrollbar { display: none; }
.category-pill {
  flex-shrink: 0; padding: 7px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03); color: var(--text-dim); font-size: 13px; white-space: nowrap;
  cursor: pointer; transition: all 0.2s; position: relative; touch-action: manipulation;
}
.category-pill.active { background: rgba(212,175,55,0.12); border-color: var(--accent-dim); color: var(--accent); }
.category-pill:active { transform: scale(0.95); }
.category-add {
  flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; border: 1px dashed var(--accent-dim);
  background: transparent; color: var(--accent); font-size: 18px; display: flex; align-items: center;
  justify-content: center; cursor: pointer; transition: all 0.2s; line-height: 1;
}
.category-add:active { transform: scale(0.9); background: rgba(212,175,55,0.1); }
.list-actions { display: flex; gap: 12px; padding: 8px 24px 12px; flex-shrink: 0; }
.action-btn {
  flex: 1; padding: 13px 8px; border: 1px solid var(--accent-dim); border-radius: 12px;
  background: rgba(212,175,55,0.04); color: var(--accent); font-size: 13px; font-weight: 500;
  text-align: center; cursor: pointer; transition: all 0.2s; display: flex; align-items: center;
  justify-content: center; gap: 6px; letter-spacing: 1px;
}
.action-btn:active { background: rgba(212,175,55,0.15); transform: scale(0.97); }
.action-icon { font-size: 16px; line-height: 1; }
.track-list-wrapper { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 0; min-height: 0; position: relative; }
.track-list { padding: 4px 0 60px; }
.track-item { position: relative; overflow: hidden; touch-action: none; -webkit-touch-callout: none; }
.track-actions { position: absolute; top: 0; right: 0; height: 100%; display: flex; z-index: 1; touch-action: manipulation; }
.track-action {
  display: flex; align-items: center; justify-content: center; width: 72px; color: #fff;
  font-size: 13px; font-weight: 500; cursor: pointer; letter-spacing: 1px; transition: filter 0.2s; touch-action: manipulation;
}
.track-action:active { filter: brightness(0.85); }
.track-action.edit { background: var(--edit-blue); }
.track-action.delete { background: var(--delete-red); }
.track-item-content {
  position: relative; z-index: 2; background: var(--bg-base); display: flex; align-items: center;
  padding: 13px 24px; transition: transform 0.3s cubic-bezier(0.32,0.72,0,1); will-change: transform;
  border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; touch-action: none; -webkit-touch-callout: none;
}
.track-item.dragging-mode .track-actions { display: none; }
.track-item-content.dragging {
  transition: none; z-index: 100; box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 0 1px rgba(212,175,55,0.3);
  background: #1a1a1a; opacity: 0.95; border-radius: 8px; touch-action: none;
}
.track-item.dragging-mode .track-item-content { border-bottom: none; }
.track-item-content.revealed { transform: translateX(-144px); }
.track-item-content.near-revealed { transform: translateX(-72px); }
.track-item.active .track-item-content { color: var(--accent); }
.track-item.active .track-number { color: var(--accent); }
.track-number { width: 32px; text-align: center; color: var(--text-dim); font-size: 14px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.track-info-cell { flex: 1; min-width: 0; }
.track-name { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 2px; }
.track-type { font-size: 11px; color: var(--text-dim); }
.track-type.video { color: rgba(212,175,55,0.5); }
.track-drag-handle { color: rgba(255,255,255,0.15); font-size: 16px; padding: 0 4px; flex-shrink: 0; touch-action: none; cursor: grab; }
.empty-list { text-align: center; color: var(--text-dim); padding: 50px 0; font-size: 14px; }
.empty-list .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.15; }
.settings-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 24px 60px; }
.settings-section { margin-bottom: 32px; }
.settings-section-title {
  font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: 2px; margin-bottom: 20px;
  padding-bottom: 10px; border-bottom: 1px solid rgba(212,175,55,0.15);
  display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: opacity 0.2s;
}
.settings-section-title:active { opacity: 0.6; }
.settings-section-title .arrow { font-size: 14px; transition: transform 0.3s ease; }
.settings-section.collapsed .arrow { transform: rotate(-90deg); }
.settings-section-body { overflow: hidden; transition: max-height 0.3s ease, opacity 0.3s ease; max-height: 2000px; opacity: 1; }
.settings-section.collapsed .settings-section-body { max-height: 0; opacity: 0; }
.settings-row { margin-bottom: 24px; }
.settings-label { font-size: 14px; color: var(--text); margin-bottom: 12px; letter-spacing: 1px; }
.color-swatches { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.color-swatch {
  width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.1);
  transition: all 0.2s; position: relative; flex-shrink: 0;
}
.color-swatch:active { transform: scale(0.9); }
.color-swatch.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(212,175,55,0.2); transform: scale(1.1); }
.color-swatch.selected::after { content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
.color-custom-wrap { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
.color-custom {
  width: 40px; height: 40px; border-radius: 50%; border: 2px dashed var(--accent-dim);
  cursor: pointer; background: transparent; -webkit-appearance: none; appearance: none; padding: 0; overflow: hidden;
}
.color-custom::-webkit-color-swatch-wrapper { padding: 0; }
.color-custom::-webkit-color-swatch { border: none; border-radius: 50%; }
.color-custom::-moz-color-swatch { border: none; border-radius: 50%; }
.color-custom-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 18px; color: var(--accent); pointer-events: none; }
.bg-image-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.bg-image-preview {
  width: 56px; height: 56px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.03); background-size: cover; background-position: center;
  flex-shrink: 0; position: relative; overflow: hidden; cursor: pointer; transition: all 0.2s;
}
.bg-image-preview:active { transform: scale(0.92); }
.bg-image-preview.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(212,175,55,0.2); }
.bg-image-preview.selected .placeholder { display: none; }
.bg-image-preview .placeholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 24px; color: var(--text-dim); }
.bg-image-preview .remove-mini {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%;
  background: rgba(231,76,60,0.85); color: #fff; font-size: 12px; display: flex; align-items: center;
  justify-content: center; cursor: pointer; z-index: 2; line-height: 1;
}
.bg-image-preview .remove-mini:active { transform: scale(0.85); }
.opacity-slider-wrap { display: flex; align-items: center; gap: 12px; }
.opacity-slider {
  flex: 1; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px;
  background: rgba(255,255,255,0.1); outline: none;
}
.opacity-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent); cursor: pointer; box-shadow: 0 0 8px rgba(212,175,55,0.4);
}
.opacity-slider::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 50%; background: var(--accent); cursor: pointer; border: none;
  box-shadow: 0 0 8px rgba(212,175,55,0.4);
}
.opacity-value { font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 36px; text-align: right; }
.data-btns { display: flex; gap: 12px; }
.data-btn {
  flex: 1; padding: 14px 8px; border: 1px solid var(--accent-dim); border-radius: 12px;
  background: rgba(212,175,55,0.04); color: var(--accent); font-size: 14px; font-weight: 500;
  text-align: center; cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
}
.data-btn:active { background: rgba(212,175,55,0.15); transform: scale(0.97); }
.list-actions.batch-mode { display: none; }
.batch-toolbar { display: none; align-items: center; gap: 8px; padding: 8px 24px 12px; flex-shrink: 0; }
.batch-toolbar.show { display: flex; }
.list-actions.batch-mode + .batch-toolbar { display: flex; }
.batch-select-all {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--accent-dim);
  border-radius: 10px; font-size: 13px; color: var(--accent); cursor: pointer; flex-shrink: 0; transition: all 0.2s; touch-action: manipulation;
}
.batch-select-all:active { transform: scale(0.97); }
.batch-select-all .check-box { width: 18px; height: 18px; border: 2px solid var(--accent-dim); border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
.batch-select-all.checked .check-box { background: var(--accent); border-color: var(--accent); }
.batch-select-all.checked .check-box::after { content: '✓'; color: #0a0a0a; font-size: 12px; font-weight: bold; }
.batch-count { flex: 1; text-align: center; font-size: 13px; color: rgba(255,255,255,0.5); font-weight: 500; }
.batch-categorize-btn {
  padding: 10px 16px; border: none; border-radius: 10px; background: var(--edit-blue); color: #fff;
  font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0; transition: all 0.2s; touch-action: manipulation; letter-spacing: 1px;
}
.batch-categorize-btn:active { transform: scale(0.97); filter: brightness(0.85); }
.batch-categorize-btn:disabled { opacity: 0.4; }
.batch-delete-btn {
  padding: 10px 16px; border: none; border-radius: 10px; background: var(--delete-red); color: #fff;
  font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0; transition: all 0.2s; touch-action: manipulation; letter-spacing: 1px;
}
.batch-delete-btn:active { transform: scale(0.97); filter: brightness(0.85); }
.batch-delete-btn:disabled { opacity: 0.4; }
.track-item .batch-check {
  display: none; width: 22px; height: 22px; min-width: 22px; border: 2px solid rgba(255,255,255,0.25);
  border-radius: 5px; margin-right: 12px; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0;
}
.track-item.batch-mode .batch-check { display: flex; }
.track-item.batch-mode .track-drag-handle { display: none; }
.track-item.batch-mode .track-actions { display: none; }
.track-item.batch-mode .track-item-content { touch-action: manipulation; }
.track-item.batch-selected .batch-check { background: var(--accent); border-color: var(--accent); }
.track-item.batch-selected .batch-check::after { content: '✓'; color: #0a0a0a; font-size: 13px; font-weight: bold; }
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 300;
  display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal {
  width: 86%; max-width: 360px; background: linear-gradient(135deg, #1a1a1a, #121212);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden;
  transform: scale(0.9); transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
.modal-overlay.show .modal { transform: scale(1); }
.modal-title { font-size: 16px; font-weight: 600; color: var(--text); text-align: center; padding: 22px 24px 8px; letter-spacing: 1px; }
.modal-body { padding: 8px 24px 20px; text-align: center; font-size: 14px; color: var(--text-dim); line-height: 1.5; }
.modal-input {
  width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; color: var(--text); font-size: 15px; outline: none; margin-top: 8px; transition: border-color 0.2s;
}
.modal-input:focus { border-color: var(--accent-dim); }
.modal-actions { display: flex; border-top: 1px solid rgba(255,255,255,0.06); }
.modal-btn {
  flex: 1; padding: 15px; background: transparent; border: none; font-size: 15px; font-weight: 500;
  cursor: pointer; transition: background 0.15s; color: var(--text-dim);
}
.modal-btn:active { background: rgba(255,255,255,0.05); }
.modal-btn.cancel { border-right: 1px solid rgba(255,255,255,0.06); }
.modal-btn.confirm { color: var(--accent); font-weight: 600; }
.modal-btn.danger { color: var(--delete-red); }
.loading-ring {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 40px; height: 40px; border: 2px solid transparent; border-top-color: var(--accent);
  border-radius: 50%; animation: loadingSpin 0.8s linear infinite; z-index: 10; opacity: 0; transition: opacity 0.3s;
}
.loading-ring.show { opacity: 1; }
@keyframes loadingSpin { to { transform: translate(-50%,-50%) rotate(360deg); } }
audio, video { display: none !important; }
input[type="file"] { display: none; }
</style>
</head>

<script>
'use strict';

// ==================== State ====================
let nextTrackId = 1;
let nextCategoryId = 1;

let categories = [
  { id: 'cat-0', name: '默认' }
];

let tracks = [
  { id: 0, name: 'SoundHelix Song 1', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', type: 'audio', categoryId: 'cat-0' },
  { id: 1, name: 'SoundHelix Song 2', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', type: 'audio', categoryId: 'cat-0' },
  { id: 2, name: 'SoundHelix Song 3', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3', type: 'audio', categoryId: 'cat-0' },
];
nextTrackId = 3;
nextCategoryId = 1;

let currentCategoryId = 'cat-0';
let currentIndex = 0;
let isPlaying = false;
let playMode = 'sequence';
let currentMedia = null;

// ==================== 数据持久化 ====================
let _db = null;
const DB_NAME = 'yingu_player_db';
const DB_STORE = 'files';
const LS_KEY = 'yingu_player_data';
const DATA_FILE = 'yingu_player_data.json';

function openDB() {
  return new Promise((resolve, reject) => {
    try {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(DB_STORE)) {
          db.createObjectStore(DB_STORE);
        }
      };
      req.onsuccess = e => { _db = e.target.result; resolve(_db); };
      req.onerror = e => { console.warn('IndexedDB 打开失败'); resolve(null); };
    } catch(e) {
      console.warn('IndexedDB 不可用:', e);
      resolve(null);
    }
  });
}

function saveToFile(jsonStr) {
  return new Promise((resolve) => {
    if (!window.cordova || !window.resolveLocalFileSystemURL) {
      try { localStorage.setItem(LS_KEY, jsonStr); } catch(e) {}
      resolve();
      return;
    }
    const path = cordova.file.dataDirectory || cordova.file.filesDirectory || cordova.file.applicationStorageDirectory;
    if (!path) { try { localStorage.setItem(LS_KEY, jsonStr); } catch(e) {} resolve(); return; }
    window.resolveLocalFileSystemURL(path, function(dirEntry) {
      dirEntry.getFile(DATA_FILE, { create: true }, function(fileEntry) {
        fileEntry.createWriter(function(writer) {
          writer.onwriteend = function() { resolve(); };
          writer.onerror = function() {
            try { localStorage.setItem(LS_KEY, jsonStr); } catch(e) {}
            resolve();
          };
          writer.write(jsonStr);
        }, function() {
          try { localStorage.setItem(LS_KEY, jsonStr); } catch(e) {}
          resolve();
        });
      }, function() {
        try { localStorage.setItem(LS_KEY, jsonStr); } catch(e) {}
        resolve();
      });
    }, function() {
      try { localStorage.setItem(LS_KEY, jsonStr); } catch(e) {}
      resolve();
    });
  });
}

function loadFromFile() {
  return new Promise((resolve) => {
    if (!window.cordova || !window.resolveLocalFileSystemURL) {
      try { resolve(localStorage.getItem(LS_KEY)); } catch(e) { resolve(null); }
      return;
    }
    const path = cordova.file.dataDirectory || cordova.file.filesDirectory || cordova.file.applicationStorageDirectory;
    if (!path) { try { resolve(localStorage.getItem(LS_KEY)); } catch(e) { resolve(null); } return; }
    window.resolveLocalFileSystemURL(path, function(dirEntry) {
      dirEntry.getFile(DATA_FILE, {}, function(fileEntry) {
        fileEntry.file(function(file) {
          const reader = new FileReader();
          reader.onloadend = function() {
            if (this.result) { resolve(this.result); }
            else { try { resolve(localStorage.getItem(LS_KEY)); } catch(e) { resolve(null); } }
          };
          reader.onerror = function() {
            try { resolve(localStorage.getItem(LS_KEY)); } catch(e) { resolve(null); }
          };
          reader.readAsText(file);
        }, function() {
          try { resolve(localStorage.getItem(LS_KEY)); } catch(e) { resolve(null); }
        });
      }, function() {
        try { resolve(localStorage.getItem(LS_KEY)); } catch(e) { resolve(null); }
      });
    }, function() {
      try { resolve(localStorage.getItem(LS_KEY)); } catch(e) { resolve(null); }
    });
  });
}

function dbPut(key, blob) {
  return new Promise((resolve, reject) => {
    if (!_db) return reject('DB not open');
    const tx = _db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(blob, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function dbGet(key) {
  return new Promise((resolve, reject) => {
    if (!_db) return reject('DB not open');
    const tx = _db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(key) {
  return new Promise((resolve, reject) => {
    if (!_db) return reject('DB not open');
    const tx = _db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

let _saveTimer = null;
let _deviceReady = false;

function saveAllData() {
  _saveToNative();
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(_doSave, 500);
}

function _saveToNative() {
  try {
    if (!_deviceReady || !window.YinguMusic || !window.YinguMusic.saveData) return;
    const data = _serializeData();
    const jsonStr = JSON.stringify(data);
    YinguMusic.saveData(jsonStr);
  } catch(e) {
    console.warn('Native即时保存失败:', e);
  }
}

function _serializeData() {
  const tracksData = tracks.map(t => {
    const copy = { ...t };
    if (copy.src && copy.src.startsWith('blob:')) {
      if (copy._fileKey) {
        copy.src = 'idb:' + copy._fileKey;
      }
      delete copy._fileKey;
    }
    return copy;
  });

  function serializeImageList(arr) {
    return arr.map((item, i) => {
      if (typeof item === 'object' && item !== null) {
        if (item._fileKey) return 'idb:' + item._fileKey;
        if (item.url && item.url.startsWith('blob:')) {
          return 'idb:' + (item._fileKey || 'img-' + i + '-' + Date.now());
        }
        return item.url || '';
      }
      if (typeof item === 'string') {
        if (item.startsWith('blob:')) {
          return '';
        }
        return item;
      }
      return '';
    });
  }

  const settingsData = {
    bgColor: settings.bgColor,
    bgOpacity: settings.bgOpacity,
    recordColor: settings.recordColor,
    recordOpacity: settings.recordOpacity,
    labelColor: settings.labelColor,
    labelOpacity: settings.labelOpacity,
    bgImageIndex: settings.bgImageIndex,
    recordImageIndex: settings.recordImageIndex,
    labelImageIndex: settings.labelImageIndex,
    bgOpacityImage: settings.bgOpacityImage,
    recordOpacityImage: settings.recordOpacityImage,
    labelOpacityImage: settings.labelOpacityImage,
    bgImages: serializeImageList(settings.bgImages),
    recordImages: serializeImageList(settings.recordImages),
    labelImages: serializeImageList(settings.labelImages)
  };

  return {
    tracks: tracksData,
    categories: categories,
    nextTrackId: nextTrackId,
    nextCategoryId: nextCategoryId,
    currentCategoryId: currentCategoryId,
    currentIndex: currentIndex,
    playMode: playMode,
    settings: settingsData,
    version: 2
  };
}

function _doSave() {
  try {
    const data = _serializeData();
    const jsonStr = JSON.stringify(data);
    localStorage.setItem(LS_KEY, jsonStr);
    saveToFile(jsonStr);
    console.log('[持久化] 数据已保存:', data.tracks.length, '首曲目');
  } catch (e) {
    console.error('[持久化] 保存失败:', e);
  }
}

async function loadAllData() {
  try {
    let raw = null;
    if (window.YinguMusic && window.YinguMusic.loadData) {
      try {
        raw = await new Promise((resolve) => {
          YinguMusic.loadData(function(result) {
            resolve(result && result.length > 0 ? result : null);
          }, function() { resolve(null); });
        });
        if (raw) console.log('[持久化] 从 SharedPreferences 加载成功');
      } catch(e) { console.warn('[持久化] SharedPreferences 加载失败:', e); }
    }
    if (!raw) {
      raw = await loadFromFile();
      if (raw) console.log('[持久化] 从文件加载成功');
    }
    if (!raw) {
      raw = localStorage.getItem(LS_KEY);
      if (raw) console.log('[持久化] 从 localStorage 加载成功');
    }
    if (!raw) {
      console.log('[持久化] 无历史数据，使用默认');
      return false;
    }

    const data = JSON.parse(raw);
    if (!data || !data.tracks) return false;

    if (data.categories && Array.isArray(data.categories)) {
      categories = data.categories;
    }
    if (data.nextTrackId) nextTrackId = data.nextTrackId;
    if (data.nextCategoryId) nextCategoryId = data.nextCategoryId;
    if (data.currentCategoryId) currentCategoryId = data.currentCategoryId;
    if (data.playMode) playMode = data.playMode;

    tracks = [];
    for (const t of data.tracks) {
      const track = { ...t };
      if (track.src && track.src.startsWith('idb:')) {
        const fileKey = track.src.substring(4);
        try {
          const blob = _db ? await dbGet(fileKey) : null;
          if (blob) {
            track.src = URL.createObjectURL(blob);
            track._fileKey = fileKey;
          } else {
            console.warn('[持久化] 音频文件未找到:', fileKey);
            track.src = '';
            track._fileKey = fileKey;
          }
        } catch (e) {
          console.warn('[持久化] 读取音频文件失败:', fileKey);
          track.src = '';
          track._fileKey = fileKey;
        }
      }
      tracks.push(track);
    }

    if (data.settings) {
      const s = data.settings;
      if (s.bgColor) settings.bgColor = s.bgColor;
      if (s.bgOpacity !== undefined) settings.bgOpacity = s.bgOpacity;
      if (s.recordColor) settings.recordColor = s.recordColor;
      if (s.recordOpacity !== undefined) settings.recordOpacity = s.recordOpacity;
      if (s.labelColor) settings.labelColor = s.labelColor;
      if (s.labelOpacity !== undefined) settings.labelOpacity = s.labelOpacity;
      if (s.bgImageIndex !== undefined) settings.bgImageIndex = s.bgImageIndex;
      if (s.recordImageIndex !== undefined) settings.recordImageIndex = s.recordImageIndex;
      if (s.labelImageIndex !== undefined) settings.labelImageIndex = s.labelImageIndex;
      if (s.bgOpacityImage !== undefined) settings.bgOpacityImage = s.bgOpacityImage;
      if (s.recordOpacityImage !== undefined) settings.recordOpacityImage = s.recordOpacityImage;
      if (s.labelOpacityImage !== undefined) settings.labelOpacityImage = s.labelOpacityImage;

      async function restoreImageList(refs) {
        const result = [];
        for (const ref of refs) {
          if (typeof ref === 'string' && ref.startsWith('idb:')) {
            try {
              const blob = await dbGet(ref.substring(4));
              if (blob) {
                result.push({ url: URL.createObjectURL(blob), _fileKey: ref.substring(4) });
              } else {
                console.warn('[持久化] 图片文件未找到:', ref);
              }
            } catch (e) {
              console.warn('[持久化] 读取图片失败:', ref);
            }
          } else if (typeof ref === 'string' && ref.length > 0 && !ref.startsWith('blob:')) {
            result.push(ref);
          }
        }
        return result;
      }

      if (s.bgImages) settings.bgImages = await restoreImageList(s.bgImages);
      if (s.recordImages) settings.recordImages = await restoreImageList(s.recordImages);
      if (s.labelImages) settings.labelImages = await restoreImageList(s.labelImages);

      if (settings.bgImageIndex >= settings.bgImages.length) settings.bgImageIndex = settings.bgImages.length - 1;
      if (settings.recordImageIndex >= settings.recordImages.length) settings.recordImageIndex = settings.recordImages.length - 1;
      if (settings.labelImageIndex >= settings.labelImages.length) settings.labelImageIndex = settings.labelImages.length - 1;
    }

    if (data.currentIndex !== undefined && data.currentIndex < tracks.length) {
      currentIndex = data.currentIndex;
    }

    console.log('[持久化] 数据已恢复:', tracks.length, '首曲目');
    return true;
  } catch (e) {
    console.error('[持久化] 加载失败:', e);
    return false;
  }
}

// ==================== Color Helpers ====================
function adjustColor(hex, amount) {
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  r = Math.max(0, Math.min(255, r + amount));
  g = Math.max(0, Math.min(255, g + amount));
  b = Math.max(0, Math.min(255, b + amount));
  return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
}

function hexToRgba(hex, alpha) {
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function formatTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);

  return `${m}:${s.toString().padStart(2, '0')}`;
}

// ==================== Artwork Generation ====================
function generateArtwork() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = settings.bgColor;
  ctx.fillRect(0, 0, 512, 512);
  const cx = 256, cy = 256, r = 210;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(cx - 40, cy - 40, 20, cx, cy, r);
  grad.addColorStop(0, adjustColor(settings.recordColor, 28));
  grad.addColorStop(0.5, settings.recordColor);
  grad.addColorStop(1, settings.recordColor);
  ctx.fillStyle = grad;
  ctx.fill();
  for (let i = 80; i < r; i += 3) {
    ctx.beginPath();
    ctx.arc(cx, cy, i, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(cx, cy, 76, 0, Math.PI * 2);
  const labelGrad = ctx.createRadialGradient(cx - 15, cy - 15, 5, cx, cy, 76);
  labelGrad.addColorStop(0, adjustColor(settings.labelColor, 18));
  labelGrad.addColorStop(0.5, settings.labelColor);
  labelGrad.addColorStop(1, adjustColor(settings.labelColor, -30));
  ctx.fillStyle = labelGrad;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.fillStyle = '#f5e6d3';
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('音轨', cx, cy + 35);
  ctx.font = '10px sans-serif';
  ctx.fillStyle = 'rgba(255,230,210,0.5)';
  ctx.fillText('YINGU', cx, cy + 50);
  return canvas.toDataURL('image/png');
}

let wakeLock = null;
let silentAudioCtx = null;
let silentSource = null;
let keepAliveTimer = null;

function startSilentKeepAlive() {
  try {
    if (!silentAudioCtx && 'AudioContext' in window) {
      silentAudioCtx = new AudioContext();
      silentSource = silentAudioCtx.createOscillator();
      const gain = silentAudioCtx.createGain();
      gain.gain.value = 0.001;
      silentSource.frequency.value = 1;
      silentSource.connect(gain);
      gain.connect(silentAudioCtx.destination);
      silentSource.start();
    }
    if (silentAudioCtx && silentAudioCtx.state === 'suspended') {
      silentAudioCtx.resume();
    }
  } catch (e) {
    console.warn('Silent keep-alive failed:', e);
  }
}

function stopSilentKeepAlive() {
  if (silentSource) {
    try { silentSource.stop(); } catch (e) {}
    silentSource = null;
  }
  if (silentAudioCtx) {
    try { silentAudioCtx.close(); } catch (e) {}
    silentAudioCtx = null;
  }
}

function startKeepAliveTimer() {
  stopKeepAliveTimer();
  keepAliveTimer = setInterval(() => {
    if (isPlaying && window.YinguMusic) {
      try {
        var name = tracks[currentIndex] ? tracks[currentIndex].name : '音轨';
        YinguMusic.updatePlayback(true, name, currentIndex + 1, tracks.length);
      } catch (e) {}
    }
    if (silentAudioCtx && silentAudioCtx.state === 'suspended') {
      silentAudioCtx.resume();
    }
    if (isPlaying && currentMedia && currentMedia.paused) {
      currentMedia.play().catch(function() {});
    }
  }, 30000);
}

function stopKeepAliveTimer() {
  if (keepAliveTimer) {
    clearInterval(keepAliveTimer);
    keepAliveTimer = null;
  }
}

async function requestWakeLock() {

    if ('wakeLock' in navigator) {

  } catch (e) {

}

function releaseWakeLock() {

}

function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.setActionHandler('play', () => play());
  navigator.mediaSession.setActionHandler('pause', () => pause());
  navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
  navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
  navigator.mediaSession.setActionHandler('seekbackward', (details) => {
    if (currentMedia && currentMedia.duration) {
      currentMedia.currentTime = Math.max(0, currentMedia.currentTime - (details.seekOffset || 10));
      updateProgress();
    }
  });
  navigator.mediaSession.setActionHandler('seekforward', (details) => {
    if (currentMedia && currentMedia.duration) {
      currentMedia.currentTime = Math.min(currentMedia.duration, currentMedia.currentTime + (details.seekOffset || 10));
      updateProgress();
    }
  });
  navigator.mediaSession.setActionHandler('seekto', (details) => {
    if (currentMedia && currentMedia.duration && details.seekTime !== undefined) {
      currentMedia.currentTime = Math.min(currentMedia.duration, Math.max(0, details.seekTime));
      updateProgress();
    }
  });
  navigator.mediaSession.setActionHandler('stop', () => pause());
}

function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const track = tracks[currentIndex];
  if (!track) return;
  try {
    const artwork = [];
    if (artworkUrl) {
      artwork.push({ src: artworkUrl, sizes: '512x512', type: 'image/png' });
    }
    if (settings.recordImages.length > 0 && settings.recordImageIndex >= 0) {
      const recItem = settings.recordImages[settings.recordImageIndex];
      const recUrl = typeof recItem === 'string' ? recItem : (recItem && recItem.url ? recItem.url : '');
      if (recUrl) artwork.unshift({ src: recUrl, sizes: '512x512', type: 'image/jpeg' });
    }
    navigator.mediaSession.m

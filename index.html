<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>线条音乐盒 · 极简播放器</title>
    <style>
        * { 
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            padding: 16px;
            position: relative;
        }

        .player-card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 0 0 1px #eaeef2;
            overflow: hidden;
            transition: all 0.2s ease;
            position: relative;
            z-index: 10;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 24px 28px 12px 28px;
            border-bottom: 1.5px solid #e2e8f0;
        }

        .title {
            font-size: 20px;
            font-weight: 520;
            letter-spacing: -0.3px;
            color: #1a2c3e;
            background: transparent;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .add-btn, .menu-btn {
            background: transparent;
            border: none;
            font-size: 32px;
            font-weight: 300;
            cursor: pointer;
            color: #2c4b6e;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            transition: all 0.2s;
            line-height: 1;
        }

        .menu-btn {
            font-size: 32px;
            font-weight: 300;
        }

        .add-btn:hover, .menu-btn:hover {
            background: #f0f4f9;
        }

        .add-btn:active, .menu-btn:active {
            transform: scale(0.94);
        }

        .disc-area {
            padding: 32px 20px 28px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vinyl-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: #fefefe;
            box-shadow: 0 0 0 2px #dce3e9, 0 12px 24px -12px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .vinyl-inner {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: inset 0 0 0 1.8px #cfdde8, 0 0 0 3px #f0f4fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px;
        }

        .song-name {
            font-weight: 560;
            font-size: 18px;
            color: #1e2f3d;
            letter-spacing: -0.2px;
            margin-bottom: 8px;
            max-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-tag {
            font-size: 13px;
            color: #6f8eac;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 40px;
            display: inline-block;
            border: 0.5px solid #e0e8f0;
        }

        .playback-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin: 8px 0 10px;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            font-size: 32px;
            cursor: pointer;
            width: 56px;
            height: 56px;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s;
            color: #2c4b6e;
        }

        .ctrl-btn:active {
            background: #eef2f7;
            transform: scale(0.96);
        }

        .play-pause {
            background: #1e2f3d;
            color: white;
            box-shadow: 0 6px 12px -6px rgba(0,0,0,0.2);
        }
        .play-pause:active {
            background: #0f1e2a;
            transform: scale(0.96);
        }

        .progress-area {
            padding: 8px 28px 20px;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #7f95b0;
            font-family: monospace;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            background: #e4eaf1;
            border-radius: 12px;
            height: 4px;
            width: 100%;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            background: #2c4b6e;
            width: 0%;
            height: 4px;
            border-radius: 12px;
            position: relative;
        }

        .footer-row {
            padding: 18px 28px 28px;
            border-top: 1.5px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mode-btn {
            background: transparent;
            border: 1.5px solid #cfdee9;
            padding: 10px 20px;
            border-radius: 44px;
            font-size: 14px;
            font-weight: 500;
            color: #2c4b6e;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(2px);
        }

        .mode-btn span:first-child {
            font-size: 18px;
        }

        .mode-btn.active {
            background: #eef3fc;
            border-color: #2c4b6e;
            color: #1a3b55;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 85%;
            max-width: 360px;
            height: 100vh;
            background: #ffffff;
            box-shadow: -8px 0 32px rgba(0, 0, 0, 0.08);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            display: flex;
            flex-direction: column;
            border-left: 1px solid #eef2f6;
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 28px 20px 16px 24px;
            border-bottom: 1.5px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-header h3 {
            font-size: 18px;
            font-weight: 520;
            color: #1e2f3d;
            letter-spacing: -0.2px;
        }

        .close-drawer {
            background: transparent;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #7f95b0;
            width: 40px;
            height: 40px;
            border-radius: 30px;
        }

        .category-section {
            margin-bottom: 8px;
        }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px 8px 24px;
            background: #fafcff;
            border-bottom: 0.5px solid #eef2f8;
            cursor: pointer;
            user-select: none;
        }
        .category-header:active {
            background: #f0f4f9;
        }
        .category-title {
            font-weight: 550;
            font-size: 15px;
            color: #2c4b6e;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .collapse-icon {
            font-size: 14px;
            transition: transform 0.2s ease;
            display: inline-block;
        }
        .category-header.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }
        .edit-cat-btn {
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #7f95b0;
            padding: 4px 8px;
            border-radius: 20px;
        }
        .category-songs {
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .category-songs.collapsed {
            max-height: 0 !important;
        }
        .playlist-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0 20px 0;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px 14px 24px;
            border-bottom: 0.5px solid #edf2f7;
            transition: background 0.1s;
            background: white;
            position: relative;
            touch-action: pan-y pinch-zoom;
            cursor: grab;
            user-select: none;
        }
        .playlist-item:active { cursor: grabbing; }
        .playlist-item.dragging-source {
            opacity: 0.3;
            background: #eef2f9;
        }
        .playlist-item.drag-over {
            border-top: 3px solid #2c4b6e;
        }
        .playlist-item.active {
            background: #f0f6fe;
            border-left: 3px solid #2c4b6e;
        }
        .item-info {
            flex: 1;
            overflow: hidden;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .drag-handle {
            font-size: 20px;
            color: #b9cee8;
            cursor: grab;
            padding: 8px 4px;
            touch-action: none;
        }
        .item-text {
            flex: 1;
            overflow: hidden;
        }
        .item-name {
            font-size: 15px;
            font-weight: 500;
            color: #1e2f3d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-meta {
            font-size: 11px;
            color: #8ca3c0;
            margin-top: 4px;
        }
        .item-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            background: white;
            transform: translateX(100%);
            transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            padding-right: 20px;
            background: linear-gradient(90deg, transparent, white 20px, white);
            z-index: 5;
        }
        .playlist-item.swiped .item-actions {
            transform: translateX(0);
        }
        .action-btn {
            background: #f8fafd;
            border: 0.5px solid #e2e8f0;
            font-size: 13px;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 30px;
            width: auto;
            min-width: 64px;
            color: #2c4b6e;
            font-weight: 500;
            white-space: nowrap;
        }
        .action-btn.delete-btn {
            color: #e26d6d;
            border-color: #ffe0e0;
        }
        .action-btn.category-btn {
            color: #4b7b9d;
        }
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(3px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s;
        }
        .drawer-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2f3dee;
            backdrop-filter: blur(8px);
            color: white;
            padding: 8px 18px;
            border-radius: 60px;
            font-size: 13px;
            z-index: 2000;
            pointer-events: none;
            white-space: nowrap;
            font-weight: 480;
            border: 0.5px solid #ffffff30;
        }
        .empty-playlist-note {
            text-align: center;
            padding: 48px 20px;
            color: #95adc7;
            font-size: 14px;
        }
        .dragging-clone {
            position: fixed;
            z-index: 9999;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.2);
            padding: 12px 20px;
            width: 240px;
            pointer-events: none;
            border-left: 3px solid #2c4b6e;
            font-size: 14px;
            font-weight: 500;
            color: #1e2f3d;
            opacity: 0.9;
        }
        @media (max-width: 480px) {
            .player-card { border-radius: 36px; }
            .vinyl-wrapper { width: 190px; height: 190px; }
            .vinyl-inner { width: 140px; height: 140px; }
            .action-btn { min-width: 56px; font-size: 12px; padding: 6px 10px; }
            .dragging-clone { width: 200px; font-size: 13px; padding: 10px 16px; }
        }
    </style>
</head>
<body>

<div class="player-card" id="app">
    <div class="header">
        <div class="title">⏚ 线 条 唱 机</div>
        <div class="header-actions">
            <button class="add-btn" id="globalAddBtn" aria-label="添加音频">+</button>
            <button class="menu-btn" id="drawerToggleBtn" aria-label="目录">☰</button>
        </div>
    </div>
    <div class="disc-area">
        <div class="vinyl-wrapper">
            <div class="vinyl-inner">
                <div class="song-name" id="currentSongName">无 声 静 谧</div>
                <div class="artist-tag" id="currentArtistHint">本地之声</div>
            </div>
        </div>
    </div>
    <div class="playback-controls">
        <button class="ctrl-btn" id="prevBtn" title="上一首">⏮</button>
        <button class="ctrl-btn play-pause" id="playPauseBtn" title="播放/暂停">▶</button>
        <button class="ctrl-btn" id="nextBtn" title="下一首">⏭</button>
    </div>
    <div class="progress-area">
        <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="durationTime">0:00</span>
        </div>
        <div class="progress-bar-bg" id="progressBarBg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>
    <div class="footer-row">
        <button class="mode-btn" id="modeToggleBtn">
            <span>🔁</span>
            <span id="modeText">顺序播放</span>
        </button>
        <div style="width: 70px;"></div>
    </div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="playlistDrawer">
    <div class="drawer-header">
        <h3>📋 所有音频</h3>
        <button class="close-drawer" id="closeDrawerBtn">✕</button>
    </div>
    <div style="padding: 8px 20px 0 24px;">
        <button id="addCategoryBtn" style="background:transparent; border:1px solid #cfdee9; border-radius:30px; padding:6px 12px; font-size:12px; color:#2c4b6e;">+ 添加分类</button>
    </div>
    <div class="playlist-container" id="drawerPlaylistContainer">
        <div class="empty-playlist-note">暂无音频，点击 + 添加</div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'line_player_playlist_v8';
    const CATEGORIES_KEY = 'line_player_categories_v7';
    const COLLAPSE_STATE_KEY = 'line_player_collapse_state_v4';

    let playlist = [];
    let categories = [];
    let collapsedCategories = new Set();
    let currentIndex = 0;
    let isPlaying = false;
    let currentAudio = null;
    let playMode = "order";
    
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressFill = document.getElementById('progressFill');
    const progressBarBg = document.getElementById('progressBarBg');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('durationTime');
    const currentSongNameSpan = document.getElementById('currentSongName');
    const currentArtistHintSpan = document.getElementById('currentArtistHint');
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    const modeTextSpan = document.getElementById('modeText');
    const globalAddBtn = document.getElementById('globalAddBtn');
    const drawerToggleBtn = document.getElementById('drawerToggleBtn');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const playlistDrawer = document.getElementById('playlistDrawer');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    const drawerContainer = document.getElementById('drawerPlaylistContainer');
    const addCategoryBtn = document.getElementById('addCategoryBtn');
    
    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
    
    function showToast(msg, duration = 1800) {
        let toast = document.querySelector('.toast-msg');
        if (!toast) {
            toast = document.createElement('div');
            toast.className = 'toast-msg';
            document.body.appendChild(toast);
        }
        toast.innerText = msg;
        toast.style.opacity = '1';
        if (window.toastTimeout) clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(() => { toast.style.opacity = '0'; }, duration);
    }
    
    function saveCollapseState() {
        localStorage.setItem(COLLAPSE_STATE_KEY, JSON.stringify(Array.from(collapsedCategories)));
    }
    
    function loadCollapseState() {
        const saved = localStorage.getItem(COLLAPSE_STATE_KEY);
        if (saved) try { collapsedCategories = new Set(JSON.parse(saved)); } catch(e) {}
    }
    
    function toggleCategory(categoryId) {
        if (collapsedCategories.has(categoryId)) collapsedCategories.delete(categoryId);
        else collapsedCategories.add(categoryId);
        saveCollapseState();
        renderDrawerList();
    }
    
    function saveAllData() {
        const serializableList = playlist.map(item => ({
            id: item.id, name: item.name, type: item.type, base64: item.base64Data,
            categoryId: item.categoryId, order: item.order, createdAt: item.createdAt
        }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(serializableList));
        localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
        saveCollapseState();
    }
    
    async function loadAllData() {
        const savedCategories = localStorage.getItem(CATEGORIES_KEY);
        categories = savedCategories ? JSON.parse(savedCategories) : [{ id: 'default', name: '默认分类' }];
        loadCollapseState();
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        try {
            const saved = JSON.parse(raw);
            const newList = [];
            for (let item of saved) {
                if (item.base64) {
                    const blob = await (await fetch(item.base64)).blob();
                    const url = URL.createObjectURL(blob);
                    newList.push({
                        id: item.id, name: item.name, type: item.type, url: url,
                        base64Data: item.base64, categoryId: item.categoryId || 'default',
                        order: item.order || 0, createdAt: item.createdAt
                    });
                }
            }
            newList.sort((a,b)=> (a.order||0) - (b.order||0));
            return newList;
        } catch(e) { return []; }
    }
    
    // 核心修复：将单个文件处理独立出来，返回 Promise
    function processSingleFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64String = e.target.result;
                const fileName = file.name;
                const audioId = Date.now() + '-' + Math.random().toString(36).substr(2, 10) + '-' + Math.random().toString(36).substr(2, 5);
                const blobUrl = URL.createObjectURL(file);
                const typeLabel = file.type.startsWith('audio/') ? 'audio' : (file.type.startsWith('video/') ? 'video' : 'audio');
                const newTrack = {
                    id: audioId, name: fileName, type: typeLabel === 'video' ? 'video' : 'audio',
                    url: blobUrl, base64Data: base64String, categoryId: 'default',
                    order: playlist.length, // 注意：这里用当前长度，但由于是并发，可能会乱序，之后会统一修复 order
                    createdAt: Date.now()
                };
                resolve(newTrack);
            };
            reader.onerror = () => reject(reader.error);
            reader.readAsDataURL(file);
        });
    }
    
    // 批量添加核心函数：使用 Promise.all 并发处理所有文件，确保全部添加
    async function addLocalFiles(files) {
        if (!files || files.length === 0) return;
        showToast(`正在处理 ${files.length} 个文件...`, 2000);
        
        try {
            // 并发处理所有文件，获取所有轨道数据
            const tracksPromises = Array.from(files).map(file => processSingleFile(file));
            const newTracks = await Promise.all(tracksPromises);
            
            // 统一设置 order，保持添加顺序
            const startOrder = playlist.length;
            newTracks.forEach((track, idx) => {
                track.order = startOrder + idx;
                playlist.push(track);
            });
            
            // 保存并刷新 UI
            saveAllData();
            await updateSongInfoAndAudio();
            renderDrawerList();
            showToast(`成功添加 ${newTracks.length} 个音频`, 1500);
        } catch (err) {
            console.error('批量添加失败:', err);
            showToast('部分文件添加失败，请重试', 2000);
        }
    }
    
    async function addRecordingFromBlob(blob, name) {
        const file = new File([blob], name, { type: blob.type });
        const newTrack = await processSingleFile(file);
        playlist.push(newTrack);
        saveAllData();
        await updateSongInfoAndAudio();
        renderDrawerList();
        showToast('录音已添加');
    }
    
    async function updateSongInfoAndAudio() {
        if (playlist.length === 0) {
            currentSongNameSpan.innerText = "无 声 静 谧";
            currentArtistHintSpan.innerText = "点击 + 添加音频";
            durationSpan.innerText = "0:00";
            currentTimeSpan.innerText = "0:00";
            if (currentAudio) { currentAudio.pause(); currentAudio = null; isPlaying = false; playPauseBtn.innerText = "▶"; }
            return;
        }
        if (currentIndex >= playlist.length) currentIndex = 0;
        const track = playlist[currentIndex];
        if (track) {
            let displayName = track.name.length > 28 ? track.name.slice(0,26)+'..' : track.name;
            currentSongNameSpan.innerText = displayName || "未知曲目";
            const sourceType = track.type === 'recording' ? '🎙 录音' : (track.type === 'video' ? '🎬 视频音轨' : '📁 音频');
            currentArtistHintSpan.innerText = sourceType;
            if (!currentAudio || currentAudio.src !== track.url) {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.removeEventListener('timeupdate', updateProgress);
                    currentAudio.removeEventListener('ended', onAudioEnded);
                    currentAudio.removeEventListener('loadedmetadata', onLoadedMeta);
                }
                const audio = new Audio(track.url);
                currentAudio = audio;
                audio.addEventListener('timeupdate', updateProgress);
                audio.addEventListener('ended', onAudioEnded);
                audio.addEventListener('loadedmetadata', onLoadedMeta);
                audio.addEventListener('error', () => showToast("播放错误"));
                if (isPlaying) audio.play().catch(() => { isPlaying=false; playPauseBtn.innerText="▶"; });
            }
            if (currentAudio && currentAudio.readyState >= 1) onLoadedMeta();
        }
        renderDrawerList();
    }
    
    function onLoadedMeta() {
        if (currentAudio && currentAudio.duration && isFinite(currentAudio.duration)) 
            durationSpan.innerText = formatTime(currentAudio.duration);
    }
